<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philippe Petit | Musical Travel-Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --punk-red: #da4444;
            --punk-black: #1a1a1a;
            --punk-cream: #f4f1ea;
            --bg-texture: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        }

        body.dark {
            --punk-cream: #0a0a0a;
            --punk-black: #e5e5e5;
            --punk-red: #ff0000;
            background-image: url("https://www.transparenttextures.com/patterns/dark-matter.png");
        }

        body {
            background-color: var(--punk-cream);
            color: var(--punk-black);
            font-family: 'Courier Prime', monospace;
            background-image: var(--bg-texture);
            transition: background-color 0.1s ease, color 0.3s ease;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, .punk-title {
            font-family: 'Special Elite', cursive;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        header {
            z-index: 50;
            position: relative;
            padding: 1rem 2rem;
            background: transparent;
        }

        .nav-link {
            position: relative;
            transition: all 0.2s;
            display: inline-block;
            padding: 2px 8px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .nav-link:hover {
            background: var(--punk-black);
            color: var(--punk-cream);
            transform: rotate(-2deg);
        }

        #lightning-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #audio-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.8;
            z-index: 20;
            pointer-events: none;
            font-family: 'Courier Prime', monospace;
            animation: pulse 2s infinite;
            background: var(--punk-black);
            color: var(--punk-cream);
            padding: 2px 6px;
        }
        
        #midi-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.7rem;
            opacity: 0.6;
            z-index: 20;
            font-family: 'Courier Prime', monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .flash-bg {
            background-color: var(--punk-black) !important;
            color: var(--punk-cream) !important;
        }
        .flash-bg-invert {
            background-color: var(--punk-cream) !important;
            color: var(--punk-black) !important;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 5px;
            border: 2px solid var(--punk-black);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: var(--punk-black);
            color: var(--punk-cream);
        }
        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body class="h-screen w-screen">

    <header class="flex flex-col md:flex-row justify-between items-center border-b-2 border-black dark:border-white">
        <div class="mb-4 md:mb-0 text-center md:text-left">
            <h1 class="text-4xl md:text-5xl font-bold leading-none">Philippe Petit</h1>
            <p class="text-sm italic mt-1 bg-black text-white inline-block px-2 dark:bg-red-600">musical travel-agent</p>
        </div>
        
        <div class="flex items-center gap-6">
            <nav>
                <ul class="flex gap-4">
                    <li><a href="listen.html" class="nav-link">Listen</a></li>
                    <li><a href="book.html" class="nav-link">Le Livre</a></li>
                    <li><a href="modulisme.html" class="nav-link">Modulisme</a></li>
                    <li><a href="booking.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>

            <button id="theme-switcher" class="theme-toggle" title="Switch Theme">
                <svg id="sun-icon" class="hidden" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.122-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.95a1 1 0 01-1.414 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zm-1.414-11.314a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM4 10a1 1 0 00-1-1H2a1 1 0 100 2h1a1 1 0 001-1z"></path></svg>
                <svg id="moon-icon" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            </button>
        </div>
    </header>

    <div id="lightning-container">
        <canvas id="lightning"></canvas>
        <div id="midi-status">MIDI: Scanning...</div>
        <div id="audio-hint">[ CLICK TO START AUDIO ]</div>
    </div>

    <script>
        // --- VISUAL SETUP ---
        const canvas = document.getElementById('lightning');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouseX = -1000, mouseY = -1000;
        let isTouching = false;
        let boltColor = '#1a1a1a';
        let glowColor = '#da4444';
        let visualIntensity = 0;
        let chaosLevel = 0; // 0 = sur le fil (calme), 1 = loin (chaos)

        // --- AUDIO ENGINE (POLYPHONIC SYNTH) ---
        let audioCtx = null;
        let masterGain, reverbNode, delayNode, delayFeedback;
        let activeVoices = new Map();
        
        // Synth Parameters
        const synthParams = {
            vco1Wave: 'sawtooth',
            vco2Wave: 'square',
            vco2Detune: 7,
            filterCutoff: 800,
            filterRes: 2,
            attack: 0.05,
            decay: 0.2,
            sustain: 0.6,
            release: 0.5,
            delayTime: 0.3,
            delayFeedback: 0.4,
            reverbMix: 0.3
        };

        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Master Chain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.4;

            // Reverb
            reverbNode = audioCtx.createConvolver();
            const rate = audioCtx.sampleRate;
            const length = rate * 2;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const l = impulse.getChannelData(0);
            const r = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                const decay = Math.pow(1 - i / length, 4);
                l[i] = (Math.random() * 2 - 1) * decay;
                r[i] = (Math.random() * 2 - 1) * decay;
            }
            reverbNode.buffer = impulse;
            const reverbDry = audioCtx.createGain();
            const reverbWet = audioCtx.createGain();
            reverbDry.gain.value = 1 - synthParams.reverbMix;
            reverbWet.gain.value = synthParams.reverbMix;

            // Delay
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = synthParams.delayTime;
            delayFeedback = audioCtx.createGain();
            delayFeedback.gain.value = synthParams.delayFeedback;
            const delayFilter = audioCtx.createBiquadFilter();
            delayFilter.frequency.value = 1000;
            
            delayNode.connect(delayFeedback);
            delayFeedback.connect(delayFilter);
            delayFilter.connect(delayNode);

            // Connections
            const inputNode = audioCtx.createGain();
            inputNode.connect(masterGain);
            inputNode.connect(delayNode);
            delayNode.connect(masterGain);
            
            masterGain.connect(reverbDry);
            masterGain.connect(reverbNode);
            reverbNode.connect(reverbWet);
            
            reverbDry.connect(audioCtx.destination);
            reverbWet.connect(audioCtx.destination);

            document.getElementById('audio-hint').innerText = "[ PLAY THE LIGHTNING ]";
            
            sequencerLoop();
        }

        // Voice Class
        class SynthVoice {
            constructor(note, velocity) {
                this.ctx = audioCtx;
                this.freq = 440 * Math.pow(2, (note - 69) / 12);
                this.velocity = velocity;
                this.startTime = this.ctx.currentTime;

                // VCO 1
                this.vco1 = this.ctx.createOscillator();
                this.vco1.type = synthParams.vco1Wave;
                this.vco1.frequency.value = this.freq;

                // VCO 2
                this.vco2 = this.ctx.createOscillator();
                this.vco2.type = synthParams.vco2Wave;
                this.vco2.frequency.value = this.freq;
                this.vco2.detune.value = synthParams.vco2Detune;

                // VCF
                this.filter = this.ctx.createBiquadFilter();
                this.filter.type = 'lowpass';
                this.filter.Q.value = synthParams.filterRes;
                
                // CHAOS MODULATION: More chaotic filter opening if chaos is high
                let chaosMod = chaosLevel * 3000;
                this.filter.frequency.value = synthParams.filterCutoff + (velocity * 2000) + chaosMod; 

                // VCA
                this.vca = this.ctx.createGain();
                this.vca.gain.value = 0;

                // FM (Chaos)
                // If chaos > 0, add Frequency Modulation for dissonance
                if (chaosLevel > 0.1) {
                    this.fmOsc = this.ctx.createOscillator();
                    this.fmOsc.frequency.value = this.freq * (1.5 + Math.random()); // Inharmonic
                    this.fmGain = this.ctx.createGain();
                    this.fmGain.gain.value = chaosLevel * 1000; // FM Depth based on distance
                    
                    this.fmOsc.connect(this.fmGain);
                    this.fmGain.connect(this.vco1.frequency);
                    this.fmOsc.start();
                }

                // Connections
                this.vco1.connect(this.filter);
                this.vco2.connect(this.filter);
                this.filter.connect(this.vca);
                this.vca.connect(delayNode);
                this.vca.connect(masterGain);

                this.vco1.start();
                this.vco2.start();

                // Envelope
                // Attacks are faster if chaotic (percussive)
                let attackTime = synthParams.attack * (1 - chaosLevel * 0.8);
                
                this.vca.gain.cancelScheduledValues(this.startTime);
                this.vca.gain.setValueAtTime(0, this.startTime);
                this.vca.gain.linearRampToValueAtTime(velocity * 0.3, this.startTime + attackTime);
                this.vca.gain.linearRampToValueAtTime(velocity * 0.3 * synthParams.sustain, this.startTime + attackTime + synthParams.decay);
            }

            stop() {
                const now = this.ctx.currentTime;
                // Shorter release if chaotic (stutter)
                let release = synthParams.release * (1 - chaosLevel * 0.9);
                
                this.vca.gain.cancelScheduledValues(now);
                this.vca.gain.setValueAtTime(this.vca.gain.value, now);
                this.vca.gain.exponentialRampToValueAtTime(0.001, now + release);

                this.vco1.stop(now + release);
                this.vco2.stop(now + release);
                if(this.fmOsc) this.fmOsc.stop(now + release);
                
                setTimeout(() => {
                    this.vco1.disconnect();
                    this.vco2.disconnect();
                    this.filter.disconnect();
                    this.vca.disconnect();
                }, release * 1000 + 100);
            }
        }

        function playNote(note, velocity = 0.5) {
            if (!audioCtx) return;
            visualIntensity = velocity;
            if (activeVoices.has(note)) activeVoices.get(note).stop();
            const voice = new SynthVoice(note, velocity);
            activeVoices.set(note, voice);
        }

        function stopNote(note) {
            if (activeVoices.has(note)) {
                activeVoices.get(note).stop();
                activeVoices.delete(note);
            }
        }

        // --- GENERATIVE SEQUENCER ---
        const scale = [48, 51, 53, 55, 58, 60, 63, 65, 67, 70]; 
        const baseSequence = [48, 55, 51, 48, 60, 55, 58, 53];
        let seqIndex = 0;

        function sequencerLoop() {
            let intensity = calculateIntensity(); // Updates global chaosLevel
            let nextTriggerTime = 400; // Default slow/melodic speed

            // Only play if there is some intensity (mouse near or touching)
            if (intensity > 0.05) {
                
                // LOGIQUE DE VITESSE (DUDUDUDU)
                // Chaos = 0 (Sur le fil) -> 300ms (Lent, posé)
                // Chaos = 1 (Loin) -> 50ms (Mitraillette)
                
                if (chaosLevel < 0.2) {
                    // Zone calme (Mélodie)
                    nextTriggerTime = 300;
                } else {
                    // Zone Chaos (Accélération exponentielle)
                    // De 300ms à 60ms
                    nextTriggerTime = 300 - (chaosLevel * 240);
                }

                // CHOIX DE LA NOTE
                let note;
                
                if (chaosLevel < 0.4) {
                    // PRÈS DU FIL : Séquence ordonnée
                    note = baseSequence[seqIndex % baseSequence.length];
                    seqIndex++;
                } else {
                    // LOIN DU FIL : Aléatoire + Glitch
                    // Plus on est loin, plus on s'éloigne de la gamme
                    if (Math.random() < chaosLevel) {
                        // Note totalement aléatoire (Glitch)
                        note = 36 + Math.floor(Math.random() * 48);
                    } else {
                        // Note de la gamme mais au hasard
                        note = scale[Math.floor(Math.random() * scale.length)];
                    }
                }

                // JEU
                let velocity = intensity * 0.8;
                // Si très chaotic, vélocité variable (stutter)
                if (chaosLevel > 0.7) velocity *= Math.random();

                playNote(note, velocity);
                
                // Durée de la note très courte si chaos (staccato)
                let noteDuration = nextTriggerTime * (chaosLevel > 0.5 ? 0.5 : 0.9);
                setTimeout(() => stopNote(note), noteDuration);
            }

            setTimeout(sequencerLoop, nextTriggerTime);
        }

        // Calculates global intensity AND chaos level
        function calculateIntensity() {
            if (!width || !height) return 0;
            const startX = width * 0.3; const startY = 50;
            const endX = width * 0.7; const endY = height - 50;
            
            // Project point logic
            const A = mouseX - startX; const B = mouseY - startY;
            const C = endX - startX; const D = endY - startY;
            const dot = A * C + B * D; const len_sq = C * C + D * D;
            const param = len_sq !== 0 ? dot / len_sq : -1;
            let xx, yy;
            if (param < 0) { xx = startX; yy = startY; }
            else if (param > 1) { xx = endX; yy = endY; }
            else { xx = startX + param * C; yy = startY + param * D; }
            const dx = mouseX - xx; const dy = mouseY - yy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // 1. Calculate Intensity (Volume/Trigger)
            // Trigger zone is fairly wide (400px)
            let val = 0;
            if (dist < 400) {
                 let norm = 1 - (dist / 400);
                 val = norm * norm; // ease in
            }
            if (isTouching) val = 1;

            // 2. Calculate Chaos Level (Distance from center line)
            // Normalized distance: 0 at line, 1 at ~400px away
            // Clamp between 0 and 1
            let rawChaos = Math.min(dist / 300, 1);
            
            // If touching (mobile or click), we assume user is "controlling" the chaos manually via position?
            // Actually, if clicking far away, dist is high, so chaos is high. Correct.
            // If clicking ON the line, dist is low, chaos is low. Correct.
            chaosLevel = rawChaos;

            visualIntensity = val;
            return val;
        }

        // --- MIDI ---
        function onMIDISuccess(midiAccess) {
            const inputs = midiAccess.inputs.values();
            let count = 0;
            for (let input of inputs) {
                input.onmidimessage = getMIDIMessage;
                count++;
            }
            if (count > 0) {
                document.getElementById('midi-status').innerText = "MIDI: Connected";
                document.getElementById('midi-status').style.color = "var(--punk-red)";
            }
        }
        function getMIDIMessage(message) {
            const command = message.data[0];
            const note = message.data[1];
            const velocity = (message.data.length > 2) ? message.data[2] : 0;
            if (command === 144 && velocity > 0) { 
                if (!audioCtx) initAudio();
                playNote(note, velocity / 127);
            } else if (command === 128 || (command === 144 && velocity === 0)) { 
                stopNote(note);
            }
        }
        if (navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(onMIDISuccess);

        // --- CANVAS ---
        function resize() {
            width = canvas.width = document.getElementById('lightning-container').offsetWidth;
            height = canvas.height = document.getElementById('lightning-container').offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawLightningLine(x1, y1, x2, y2, displace, iteration) {
            if (displace < 2 || iteration > 8) {
                ctx.lineTo(x2, y2);
                return;
            }
            let midX = (x1 + x2) / 2;
            let midY = (y1 + y2) / 2;
            midX += (Math.random() - 0.5) * displace;
            midY += (Math.random() - 0.5) * displace;
            drawLightningLine(x1, y1, midX, midY, displace / 2, iteration + 1);
            drawLightningLine(midX, midY, x2, y2, displace / 2, iteration + 1);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            const isDark = document.body.classList.contains('dark');
            boltColor = isDark ? '#ffffff' : '#1a1a1a';
            glowColor = isDark ? '#ff0000' : '#da4444';

            // Visual Jitter depends on Chaos too
            // High chaos = extremely unstable bolt
            let jitterIntensity = (activeVoices.size > 0) ? 0.8 : visualIntensity;
            if (chaosLevel > 0.6) jitterIntensity += 0.5; // Extra jitter far away

            if (jitterIntensity > 0.7 && Math.random() > 0.8) {
                 document.body.classList.add(isDark ? 'flash-bg-invert' : 'flash-bg');
            } else {
                 document.body.classList.remove(isDark ? 'flash-bg-invert' : 'flash-bg');
            }

            const startX = width * 0.3; const startY = 50;
            const endX = width * 0.7; const endY = height - 50;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            let jitter = 30 + (jitterIntensity * 200);
            ctx.lineWidth = 2 + (jitterIntensity * 6);
            ctx.strokeStyle = boltColor;
            ctx.shadowBlur = 10 + (jitterIntensity * 30);
            ctx.shadowColor = glowColor;
            
            drawLightningLine(startX, startY, endX, endY, jitter, 0);
            ctx.stroke();

            // Interaction Arc
            let activeNoteCount = activeVoices.size;
            if (activeNoteCount > 0) {
                for(let i=0; i<activeNoteCount; i++) {
                    ctx.beginPath();
                    ctx.lineWidth = 1;
                    ctx.moveTo(startX + (Math.random()*width*0.4), startY + (Math.random()*height*0.8));
                    drawLightningLine(startX, startY, endX, endY, jitter*1.5, 0);
                    ctx.stroke();
                }
            } else if (visualIntensity > 0.1 && mouseX > -100) {
                // Project point again for drawing
                const A = mouseX - startX; const B = mouseY - startY;
                const C = endX - startX; const D = endY - startY;
                const dot = A * C + B * D; const len_sq = C * C + D * D;
                const param = len_sq !== 0 ? dot / len_sq : -1;
                let xx, yy;
                if (param < 0) { xx = startX; yy = startY; }
                else if (param > 1) { xx = endX; yy = endY; }
                else { xx = startX + param * C; yy = startY + param * D; }

                ctx.beginPath();
                ctx.lineWidth = 1 + (chaosLevel * 2); // Thicker arc when chaotic
                ctx.moveTo(xx, yy);
                drawLightningLine(xx, yy, mouseX, mouseY, 40 + (chaosLevel * 100), 0);
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        // Input
        const container = document.getElementById('lightning-container');
        const startAudio = () => {
            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };

        container.addEventListener('mousedown', (e) => {
            startAudio();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        container.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        container.addEventListener('mouseup', () => isTouching = false);

        container.addEventListener('touchstart', (e) => {
            startAudio();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
            e.preventDefault();
        });
        container.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });
        container.addEventListener('touchend', (e) => { 
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.touches[0].clientX - rect.left;
                mouseY = e.touches[0].clientY - rect.top;
            } else {
                isTouching = false; 
                mouseX = -1000; 
            }
        });
        container.addEventListener('mouseleave', () => { isTouching = false; mouseX = -1000; });

        // Theme
        const themeBtn = document.getElementById('theme-switcher');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') !== 'light') {
            document.body.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        }

        animate();
    </script>
</body>
</html>
