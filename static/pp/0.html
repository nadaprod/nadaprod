<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philippe Petit | Musical Travel-Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --punk-red: #da4444;
            --punk-black: #1a1a1a;
            --punk-cream: #f4f1ea;
            --bg-texture: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        }

        body.dark {
            --punk-cream: #0a0a0a;
            --punk-black: #e5e5e5;
            --punk-red: #ff0000;
            background-image: url("https://www.transparenttextures.com/patterns/dark-matter.png");
        }

        body {
            background-color: var(--punk-cream);
            color: var(--punk-black);
            font-family: 'Courier Prime', monospace;
            background-image: var(--bg-texture);
            transition: background-color 0.1s ease, color 0.3s ease;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, .punk-title {
            font-family: 'Special Elite', cursive;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* Navigation Minimaliste */
        header {
            z-index: 50;
            position: relative;
            padding: 1rem 2rem;
            background: transparent;
        }

        .nav-link {
            position: relative;
            transition: all 0.2s;
            display: inline-block;
            padding: 2px 8px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .nav-link:hover {
            background: var(--punk-black);
            color: var(--punk-cream);
            transform: rotate(-2deg);
        }

        /* Canvas Eclair */
        #lightning-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Audio Hint */
        #audio-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.8;
            z-index: 20;
            pointer-events: none;
            font-family: 'Courier Prime', monospace;
            animation: pulse 2s infinite;
            background: var(--punk-black);
            color: var(--punk-cream);
            padding: 2px 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Flash effects */
        .flash-bg {
            background-color: var(--punk-black) !important;
            color: var(--punk-cream) !important;
        }
        .flash-bg-invert {
            background-color: var(--punk-cream) !important;
            color: var(--punk-black) !important;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 5px;
            border: 2px solid var(--punk-black);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: var(--punk-black);
            color: var(--punk-cream);
        }
        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body class="h-screen w-screen">

    <header class="flex flex-col md:flex-row justify-between items-center border-b-2 border-black dark:border-white">
        <div class="mb-4 md:mb-0 text-center md:text-left">
            <h1 class="text-4xl md:text-5xl font-bold leading-none">Philippe Petit</h1>
            <p class="text-sm italic mt-1 bg-black text-white inline-block px-2 dark:bg-red-600">musical travel-agent</p>
        </div>
        
        <div class="flex items-center gap-6">
            <nav>
                <ul class="flex gap-4">
                    <li><a href="listen.html" class="nav-link">Listen</a></li>
                    <li><a href="modulisme.html" class="nav-link">Modulisme</a></li>
                    <li><a href="news.html" class="nav-link">News</a></li>
                </ul>
            </nav>

            <button id="theme-switcher" class="theme-toggle" title="Switch Theme">
                <svg id="sun-icon" class="hidden" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.122-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.95a1 1 0 01-1.414 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zm-1.414-11.314a1 1 0 010 1.414l-.707.707a1 1 0 011.414 0zM4 10a1 1 0 00-1-1H2a1 1 0 100 2h1a1 1 0 001-1z"></path></svg>
                <svg id="moon-icon" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            </button>
        </div>
    </header>

    <div id="lightning-container">
        <canvas id="lightning"></canvas>
        <div id="audio-hint">[ CLICK OR APPROACH THE CURRENT ]</div>
    </div>

    <script>
        // --- VISUAL SETUP ---
        const canvas = document.getElementById('lightning');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouseX = -1000, mouseY = -1000;
        let isTouching = false;
        let boltColor = '#1a1a1a';
        let glowColor = '#da4444';

        // --- AUDIO ENGINE (Modular Synth Style) ---
        let audioCtx = null;
        let masterGain;
        let delayNode, feedbackNode;
        let isAudioInit = false;
        
        // State for the sequencer
        let currentIntensity = 0; // 0 (far) to 1 (touching)
        let step = 0;
        // A dark, hypnotic Phrygian-ish sequence (Midi notes)
        // A2, Bb2, C3, E3, F3, E3, C3, Bb2
        const baseSequence = [45, 46, 48, 52, 53, 52, 48, 46]; 

        // Convert MIDI note to Frequency
        function mtof(note) { return 440 * Math.pow(2, (note - 69) / 12); }

        function initAudio() {
            if (isAudioInit) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // Master Gain (Limiter-ish)
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.4;
            masterGain.connect(audioCtx.destination);

            // Delay Line (Dub / Space Echo feel)
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.35; // 350ms delay
            
            feedbackNode = audioCtx.createGain();
            feedbackNode.gain.value = 0.4; // Feedback amount
            
            // Filter on delay feedback for "Tape Echo" darkness
            const delayFilter = audioCtx.createBiquadFilter();
            delayFilter.type = 'lowpass';
            delayFilter.frequency.value = 1200;

            // Connect Delay Loop
            delayNode.connect(delayFilter);
            delayFilter.connect(feedbackNode);
            feedbackNode.connect(delayNode);
            
            // Connect Delay to Master
            delayNode.connect(masterGain);

            // Start the sequencer loop
            sequencerLoop();
            
            isAudioInit = true;
            document.getElementById('audio-hint').innerText = "[ approach the current ]";
        }

        // The Synth Voice (FM Synthesis)
        function triggerSynth(intensity) {
            // FIX: Ensure context is running if suspended (browser autoplay policy)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // 1. Determine Pitch
            let note = baseSequence[step % baseSequence.length];
            
            // ALEATORY: If intensity is high, random chance to glitch pitch
            // "Change frequencies aleatoiry"
            if (Math.random() < (intensity * 0.8)) {
                // Random octave jumps or dissonant intervals
                note += Math.floor((Math.random() - 0.5) * 24); 
            }

            const freq = mtof(note);

            // 2. Oscillators (FM)
            const carrier = audioCtx.createOscillator();
            const modulator = audioCtx.createOscillator();
            const modGain = audioCtx.createGain();
            
            // 3. Shaping
            const filter = audioCtx.createBiquadFilter();
            const amp = audioCtx.createGain();

            // FM Configuration
            // As intensity increases, FM becomes more complex (inharmonic)
            let modRatio = 1; 
            if (intensity > 0.3) modRatio = 2;
            if (intensity > 0.6) modRatio = 2.5 + Math.random(); // Inharmonic
            
            modulator.frequency.value = freq * modRatio;
            
            // Modulation Index increases with intensity (brighter, noisier)
            const fmDepth = 100 + (intensity * 2000); 
            modGain.gain.setValueAtTime(fmDepth, audioCtx.currentTime);
            // Envelope on FM amount (pluck sound)
            modGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            carrier.frequency.value = freq;
            carrier.type = intensity > 0.7 ? 'sawtooth' : 'sine'; // Grittier waveform when close

            // Filter
            filter.type = 'lowpass';
            // Cutoff opens with intensity
            const cutoff = 400 + (intensity * 6000); 
            filter.frequency.setValueAtTime(cutoff, audioCtx.currentTime);
            filter.Q.value = 3 + (intensity * 5); // More resonance when intense

            // Routing
            modulator.connect(modGain);
            modGain.connect(carrier.frequency);
            carrier.connect(filter);
            filter.connect(amp);
            amp.connect(masterGain);
            amp.connect(delayNode); // Send to delay

            // Amplitude Envelope
            amp.gain.setValueAtTime(0, audioCtx.currentTime);
            amp.gain.linearRampToValueAtTime(0.3 + (intensity * 0.2), audioCtx.currentTime + 0.005); // Attack
            amp.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); // Decay

            // Start/Stop
            carrier.start();
            modulator.start();
            carrier.stop(audioCtx.currentTime + 0.5);
            modulator.stop(audioCtx.currentTime + 0.5);

            step++;
        }

        // Recursive Sequencer Loop
        function sequencerLoop() {
            // "Speed with distance"
            // Far (intensity 0) = Slow (e.g. 600ms)
            // Close (intensity 1) = Fast (e.g. 60ms)
            let delayMs = 600 - (currentIntensity * 540); 
            if (delayMs < 60) delayMs = 60; // Max speed limit

            // Add some jitter/humanization if intensity is low, or machine-gun precision if high
            // Actually, let's make it unstable when intensity is high
            if (currentIntensity > 0.8) {
                delayMs += (Math.random() - 0.5) * 50; 
            }

            if (isAudioInit) {
                triggerSynth(currentIntensity);
            }

            setTimeout(sequencerLoop, delayMs);
        }


        // --- VISUAL & INTERACTION LOGIC ---
        function resize() {
            width = canvas.width = document.getElementById('lightning-container').offsetWidth;
            height = canvas.height = document.getElementById('lightning-container').offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Draw lightning recursive function
        function drawLightning(x1, y1, x2, y2, displace, iteration) {
            if (displace < 2 || iteration > 8) {
                ctx.lineTo(x2, y2);
                return;
            }
            let midX = (x1 + x2) / 2;
            let midY = (y1 + y2) / 2;
            midX += (Math.random() - 0.5) * displace;
            midY += (Math.random() - 0.5) * displace;
            drawLightning(x1, y1, midX, midY, displace / 2, iteration + 1);
            drawLightning(midX, midY, x2, y2, displace / 2, iteration + 1);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            const isDark = document.body.classList.contains('dark');
            boltColor = isDark ? '#ffffff' : '#1a1a1a';
            glowColor = isDark ? '#ff0000' : '#da4444';

            // Coordinates for the wire
            const startX = width * 0.3;
            const startY = 50;
            const endX = width * 0.7;
            const endY = height - 50;
            
            // Calculate Distance
            // Project point on line segment
            const A = mouseX - startX;
            const B = mouseY - startY;
            const C = endX - startX;
            const D = endY - startY;
            const dot = A * C + B * D;
            const len_sq = C * C + D * D;
            const param = len_sq !== 0 ? dot / len_sq : -1;
            let xx, yy;
            if (param < 0) { xx = startX; yy = startY; }
            else if (param > 1) { xx = endX; yy = endY; }
            else { xx = startX + param * C; yy = startY + param * D; }
            
            const dx = mouseX - xx;
            const dy = mouseY - yy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // Update Global Intensity for Audio
            // 200px range for effect
            if (dist < 300) {
                 // Non-linear curve for better feel
                 let norm = 1 - (dist / 300);
                 currentIntensity = norm * norm; // ease in
            } else {
                currentIntensity = 0;
            }
            if (isTouching) currentIntensity = 1;

            // Visuals
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            // Jitter increases with intensity
            let jitter = 30 + (currentIntensity * 200);
            
            // Flash effect if intense
            if (currentIntensity > 0.8 && Math.random() > 0.8) {
                document.body.classList.add(isDark ? 'flash-bg-invert' : 'flash-bg');
            } else {
                document.body.classList.remove(isDark ? 'flash-bg-invert' : 'flash-bg');
            }

            ctx.lineWidth = 2 + (currentIntensity * 5);
            ctx.strokeStyle = boltColor;
            ctx.shadowBlur = 10 + (currentIntensity * 30);
            ctx.shadowColor = glowColor;
            
            drawLightning(startX, startY, endX, endY, jitter, 0);
            ctx.stroke();

            // Secondary arc (interaction)
            if (currentIntensity > 0.1 && mouseX > -100) {
                ctx.beginPath();
                ctx.lineWidth = 1;
                ctx.moveTo(xx, yy);
                drawLightning(xx, yy, mouseX, mouseY, 40, 0);
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        // Input Handling
        const container = document.getElementById('lightning-container');
        
        // Strict Click Handler for Audio Context Resume
        const handleInteractionStart = () => {
             if (!audioCtx) initAudio();
             if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };

        // Desktop Mouse Interaction
        container.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Click anywhere to enable "God Mode" (intense interaction)
        container.addEventListener('mousedown', (e) => {
            handleInteractionStart();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        container.addEventListener('mouseup', () => {
            isTouching = false;
        });

        // Mobile Touch Interaction
        container.addEventListener('touchstart', (e) => {
            handleInteractionStart();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
            e.preventDefault();
        });
        
        container.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });

        container.addEventListener('touchend', () => { isTouching = false; mouseX = -1000; });
        container.addEventListener('mouseleave', () => { mouseX = -1000; isTouching = false; });

        // Theme Init
        const themeBtn = document.getElementById('theme-switcher');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent triggering audio just by theme switch
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') !== 'light') {
            document.body.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        }

        animate();
    </script>
</body>
</html>
