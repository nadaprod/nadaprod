<!DOCTYPE html>
<html lang="fr" class="h-full antialiased bg-[#1a1a1a]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PH.PETIT // CIRCUIT_BENDER_2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['Courier Prime', 'monospace'],
                        marker: ['Special Elite', 'cursive'],
                    },
                    colors: { accent: 'var(--accent)', bg: '#1a1a1a' }
                }
            }
        }
    </script>

    <style>
        :root { 
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); 
            --accent: #da4444; /* Rouge Punk par défaut */:root {
			transition: --accent 0.8s ease;
		}

		@property --accent {
			syntax: '<color>';
			initial-value: #da4444;
			inherits: true;
		}

		body { 
            background-color: #1a1a1a; 
            color: #f4f1ea; 
            overflow: hidden;
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            transition: background-color 0.5s ease;
        }
        
        /* --- GLITCH ENGINE CANVAS --- */
        #glitch-canvas {
            position: fixed; inset: 0; z-index: 0;
            opacity: 1; pointer-events: none;
            mix-blend-mode: screen;
        }

        #ambient-bg { 
            position: fixed; inset: 0; z-index: -1; 
            background-size: cover; background-position: center; 
            filter: blur(60px) brightness(0.2) saturate(2); 
            opacity: 0; transition: opacity 1.5s ease, background-image 1s ease; 
        }

        /* --- BRUTALIST UI --- */
        .module-frame {
            border: 4px solid #f4f1ea;
            box-shadow: 12px 12px 0px var(--accent);
            background: #000;
            transition: box-shadow 0.8s var(--ease-out-expo), transform 0.1s var(--ease-out-expo);
        }

        .dymo-label {
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            font-family: 'Special Elite', cursive;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px #000;
            display: inline-block;
            transition: background-color 0.8s ease;
        }

        #gallery-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: #1a1a1a;
            background-image: url("https://www.transparenttextures.com/patterns/3px-tile.png");
            transition: transform 0.6s var(--ease-out-expo);
        }
        #gallery-overlay.hidden-state { transform: translateY(-100%); }

        .gallery-item {
            border: 2px solid rgba(244, 241, 234, 0.1);
            padding: 12px;
            transition: all 0.3s ease;
            background: rgba(0,0,0,0.3);
        }
        .gallery-item:hover {
            border-color: var(--accent);
            transform: scale(1.03) rotate(-1deg);
            box-shadow: 10px 10px 0px var(--accent);
        }

        iframe { filter: contrast(1.1) brightness(1.1); mix-blend-mode: lighten; }

        .text-accent { color: var(--accent); transition: color 0.8s ease; }
        .border-accent { border-color: var(--accent); transition: border-color 0.8s ease; }

        .scroller::-webkit-scrollbar { width: 8px; }
        .scroller::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid #1a1a1a; }
    </style>
</head>
<body class="font-mono">

    <canvas id="glitch-canvas"></canvas>
    <div id="ambient-bg"></div>

    <div id="gallery-overlay" class="p-6 md:p-12 overflow-y-auto scroller">
        <div class="max-w-6xl mx-auto">
            <header class="mb-16 border-b-8 border-white pb-8 text-left">
                <h1 class="text-5xl md:text-8xl font-bold tracking-tighter uppercase font-marker">
                    Philippe Petit<br>
                    <span class="text-accent italic">Audio_Archives</span>
                </h1>
                <div class="mt-6 flex flex-wrap gap-6">
                    <span class="dymo-label">Patch_V.2026</span>
                    <span class="font-mono text-xs text-zinc-500 uppercase self-center tracking-widest">Select module to initiate circuit</span>
                </div>
            </header>

            <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                </div>
        </div>
    </div>

    <main id="player-ui" class="fixed inset-0 z-10 flex flex-col justify-between p-6 md:p-10 opacity-0 pointer-events-none transition-opacity duration-700">
        
        <header class="w-full flex justify-between items-start pointer-events-auto">
            <div class="flex gap-6">
                <button onclick="app.toggleGallery()" class="px-6 py-3 bg-white text-black font-marker hover:bg-accent hover:text-white transition-all border-4 border-black shadow-[6px_6px_0px_var(--accent)] active:translate-y-1 active:shadow-none">
                    GRID_VIEW
                </button>
                <div class="hidden md:block bg-black/50 p-2 border-l-4 border-accent">
                    <div class="text-lg font-bold uppercase leading-none font-marker text-accent">BROADCAST_ACTIVE</div>
                    <div class="text-[9px] uppercase tracking-widest opacity-60">Source: Marseille_FR / Analog_Bender</div>
                </div>
            </div>
            <button onclick="app.scan()" class="px-8 py-3 border-4 border-white bg-black hover:border-accent font-marker text-sm shadow-[6px_6px_0px_var(--accent)] transition-all">
                SCAN_RANDOM
            </button>
        </header>

        <div class="flex-1 flex items-center justify-center pointer-events-none">
            <div id="tilt-container" class="perspective-container w-full max-w-[500px] pointer-events-auto">
                <div id="artwork-card" class="module-frame aspect-square relative overflow-hidden">
                    <div class="absolute top-4 left-4 z-20">
                        <span class="dymo-label text-xs" id="dymo-name">CONNECTING...</span>
                    </div>
                    <div id="bc-player-container" class="w-full h-full relative z-10 bg-zinc-900"></div>
                </div>
            </div>
        </div>

        <section class="w-full pointer-events-auto flex flex-col md:flex-row justify-between items-end border-t-4 border-white pt-6">
            <div class="flex flex-col gap-3">
                <div id="station-name" class="font-marker text-2xl md:text-4xl text-white uppercase tracking-tighter bg-black px-4 shadow-[4px_4px_0px_var(--accent)]">---</div>
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-accent animate-pulse rounded-none"></div>
                    <span class="text-[10px] uppercase font-bold tracking-[0.2em] opacity-60">Signal Locked / High_Fidelity</span>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-xs opacity-50 uppercase italic mb-1">"a musical travel-agent"</p>
                <p class="text-2xl text-accent font-marker tracking-tighter">PHILIPPE PETIT</p>
            </div>
        </section>
    </main>

    <script>
        class BandcampApp {
            constructor() {
                this.stations = [
					{ id: "1498133272", name: "CAA-49", art: "https://f4.bcbits.com/img/a0268077413_10.jpg" },
                    { id: "131578926", name: "A Space between spaces", art: "https://f4.bcbits.com/img/a3190970523_10.jpg" },
                    { id: "761317344", name: "Cymbalomentums", art: "https://f4.bcbits.com/img/a3169340417_10.jpg" },
                    { id: "637148813", name: "The Swordfish & The Pearl", art: "https://f4.bcbits.com/img/a1340084090_10.jpg" },
                    { id: "1360609619", name: "A Descent Into The Maëlstrom", art: "https://f4.bcbits.com/img/a2401643636_10.jpg" },
                    { id: "4277167260", name: "Chapel In The Pines", art: "https://f4.bcbits.com/img/a1065190154_10.jpg" },
                    { id: "1915377888", name: "on top... (w/ friends)", art: "https://f4.bcbits.com/img/a2593820037_10.jpg" },
                    { id: "1387724272", name: "Ovaries EP (w/ Dagger Moth)", art: "https://f4.bcbits.com/img/a1782037338_10.jpg" },
                    { id: "1382154926", name: "Buzzing but not hung up on hip", art: "https://f4.bcbits.com/img/a2628891144_10.jpg" },
                ];
                
                this.playedIds = [];
                this.isGalleryOpen = true;
                this.chaos = 0;

                this.ui = {
                    player: document.getElementById('player-ui'),
                    container: document.getElementById('bc-player-container'),
                    station: document.getElementById('station-name'),
                    dymo: document.getElementById('dymo-name'),
                    ambient: document.getElementById('ambient-bg'),
                    gallery: document.getElementById('gallery-overlay'),
                    grid: document.getElementById('gallery-grid'),
                    canvas: document.getElementById('glitch-canvas')
                };

                this.initGallery();
                this.initGlitchEngine();
            }

            initGallery() {
                this.stations.forEach(station => {
                    const item = document.createElement('div');
                    item.className = "gallery-item cursor-pointer group";
                    item.innerHTML = `
                        <div class="aspect-square overflow-hidden mb-4 border-2 border-white/20">
                            <img src="${station.art}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                        </div>
                        <h3 class="font-marker text-base text-zinc-400 group-hover:text-white truncate uppercase tracking-tighter">${station.name}</h3>
                    `;
                    item.onmouseenter = () => this.chaos = 0.8;
                    item.onmouseleave = () => this.chaos = 0;
                    item.onclick = () => this.selectFromGallery(station);
                    this.ui.grid.appendChild(item);
                });
            }

            // EXTRACTION ET APPLICATION COULEUR
			applyAccent(imgUrl) {
				const img = new Image();
				
				// 1. On active la demande de permission CORS
				img.crossOrigin = "Anonymous";
				
				// 2. On passe par un proxy qui ajoute l'en-tête 'Access-Control-Allow-Origin'
				// On demande aussi une version miniature (w=10) pour gagner en performance
				img.src = `https://images.weserv.nl/?url=${encodeURIComponent(imgUrl)}&w=10`;

				img.onload = () => {
					try {
						const canvas = document.createElement('canvas');
						const ctx = canvas.getContext('2d');
						canvas.width = 1; 
						canvas.height = 1;
						
						// On dessine l'image sur un pixel
						ctx.drawImage(img, 0, 0, 1, 1);
						
						// On récupère la couleur de ce pixel
						const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
						
						// On vérifie que la couleur n'est pas transparente
						if (r + g + b > 0) {
							const color = `rgb(${r},${g},${b})`;
							document.documentElement.style.setProperty('--accent', color);
						}
					} catch (e) {
						console.error("Erreur de lecture du canvas :", e);
						// Retour au rouge par défaut en cas de pépin
						document.documentElement.style.setProperty('--accent', '#da4444');
					}
				};

				img.onerror = () => {
					console.error("L'image n'a pas pu être chargée via le proxy.");
				};
			}

            selectFromGallery(station) {
                this.playedIds.push(station.id);
                this.toggleGallery();
                this.loadStation(station);
                setTimeout(() => {
                    this.ui.player.style.opacity = '1';
                    this.ui.player.style.pointerEvents = 'auto';
                }, 400);
            }

            scan() {
                if (this.playedIds.length >= this.stations.length) this.playedIds = [];
                const available = this.stations.filter(s => !this.playedIds.includes(s.id));
                const station = available[Math.floor(Math.random() * available.length)];
                this.playedIds.push(station.id);
                this.loadStation(station);
            }

            loadStation(station) {
                this.ui.station.innerText = station.name;
                this.ui.dymo.innerText = `FREQ_${station.id}`;
                this.ui.ambient.style.opacity = '0.4';
                this.ui.ambient.style.backgroundImage = `url(${station.art})`;
                
                // Application de l'accent dynamique
                this.applyAccent(station.art);

                this.ui.container.innerHTML = `
                    <iframe style="border:0;width:100%;height:100%;" 
                    src="https://bandcamp.com/EmbeddedPlayer/album=${station.id}/size=large/bgcol=1a1a1a/linkcol=ffffff/minimal=true/transparent=true/" 
                    seamless></iframe>`;
            }

            toggleGallery() {
                this.isGalleryOpen = !this.isGalleryOpen;
                this.ui.gallery.classList.toggle('hidden-state', !this.isGalleryOpen);
            }

            initGlitchEngine() {
                const ctx = this.ui.canvas.getContext('2d');
                let w = this.ui.canvas.width = window.innerWidth;
                let h = this.ui.canvas.height = window.innerHeight;

                const render = () => {
                    ctx.clearRect(0,0,w,h);
                    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent');
                    
                    if (this.chaos > 0 || !this.isGalleryOpen) {
                        const level = this.isGalleryOpen ? this.chaos : 0.2;
                        
                        ctx.fillStyle = accentColor;
                        for(let i=0; i<15 * level; i++) {
                            const y = Math.random() * h;
                            const bh = Math.random() * 15;
                            ctx.globalAlpha = Math.random() * 0.3;
                            ctx.fillRect(0, y, w, bh);
                        }
                        
                        for(let i=0; i<8 * level; i++) {
                            const x = Math.random() * w;
                            const y = Math.random() * h;
                            ctx.globalAlpha = 0.6;
                            ctx.fillRect(x, y, Math.random() * 150, 1);
                        }
                    }
                    requestAnimationFrame(render);
                };
                render();
                window.onresize = () => { w = this.ui.canvas.width = window.innerWidth; h = this.ui.canvas.height = window.innerHeight; };
            }
        }

        const app = new BandcampApp();

        const card = document.getElementById('artwork-card');
        document.addEventListener('mousemove', (e) => {
            if(app.isGalleryOpen) return;
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
