<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NADAPROD BOOKS</title>
    
    <!-- PWA Setup -->
    <meta name="theme-color" content="#1c1917">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="NADAPROD BOOKS">
    
    <!-- Icons (Using a generic book icon for demo) -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">

    <!-- Manifest JSON Data URI for Single File PWA -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NADAPROD BOOKS%22%2C%22short_name%22%3A%22NADAPROD BOOKS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fcfbf9%22%2C%22theme_color%22%3A%22%231c1917%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3389%2F3389081.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3389%2F3389081.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D'>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Syne:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;700&family=Schoolbell&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif', 'Georgia'],
                        brand: ['Cinzel', 'serif'],
                        baskerville: ['Syne', 'serif'],
                        raleway: ['Raleway', 'sans-serif'],
                        hand: ['Schoolbell', 'cursive'],
                    },
                    colors: {
                        red: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        },
                        sepia: { 
                            bg: '#fdf6e3', 
                            paper: '#eee4d1', 
                            ink: '#5f4b32' 
                        },
                        stone: { 850: '#1f1c1a' }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'bounce-in': 'bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        bounceIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Mobile Scroll Fixes */
        html, body { 
            height: 100%;
            height: 100dvh; /* Dynamic viewport height */
            overflow: hidden; /* Prevent body scroll, handle in containers */
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none; 
        }
        
        .archive-texture {
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            background-blend-mode: multiply;
        }

        .wf-highlight {
            border-bottom: 2px solid #991b1b;
            background-color: rgba(153, 27, 27, 0.1);
            cursor: pointer;
        }

        .book-shadow {
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 10px 0 20px -10px rgba(0,0,0,0.1);
        }
        .dark .book-shadow {
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255,255,255,0.05);
        }
        
        /* Hide Scrollbar but allow scroll */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#fcfbf9] text-stone-900 antialiased select-none archive-texture">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- MOCK DATA ---
        const SERVER_LIBRARY = [
			{
				id: "new_01",
				title: "Révolutionnaires , anarchiste , fouteur de merde , qui sommes nous ?",
				author: "Isia Rose",
                cover_gradient: "from-stone-800 to-red-900",
                cover_url: "",
                url: "/dl/isia-rose-revolutionnaires-anarchiste-fouteur-de-merde-qui-sommes-nous.epub"
			},
            {
                id: "bk_arch_01",
                title: "La Conquête du Pain",
                author: "Pierre Kropotkine",
                cover_gradient: "from-stone-800 to-red-900",
                cover_url: "",
                url: "/dl/pierre-kropotkine-la-conquete-du-pain.epub"
            },
            {
                id: "bk_arch_02",
                title: "Qu'est-ce que la propriété ?",
                author: "Pierre-Joseph Proudhon",
                cover_gradient: "from-stone-900 to-stone-700",
                cover_url: "",
                url: "/dl/pierre-joseph-proudhon-qu-est-ce-que-la-propriete-fr.epub"
            },
            {
                id: "bk_arch_03",
                title: "Mémoires",
                author: "Louise Michel",
                cover_gradient: "from-red-950 to-black",
                cover_url: "",
                url: "https://files.gutenberg.org/cache/epub/14022/pg14022.epub"
            },
            {
                id: "bk_arch_04",
                title: "L'Évolution, la Révolution...",
                author: "Élisée Reclus",
                cover_gradient: "from-stone-700 to-stone-500",
                cover_url: "",
                url: "https://files.gutenberg.org/cache/epub/26605/pg26605.epub"
            },
            {
                id: "bk_server_02",
                title: "L'ANARCHIE. 1896",
                author: "Élisée Reclus",
                cover_gradient: "from-black to-red-700",
                cover_url: "/dl/lanarchiste-001.jpg",
                url: "/dl/lanarchiste-001.epub"
            },
            {
                id: "bk_server_03",
                title: "L'Encyclopédie anarchiste",
                author: "Sébastien Faure",
                cover_gradient: "from-emerald-500 to-teal-800",
                cover_url: "/dl/lanarchiste-002.jpg",
                url: "/dl/lanarchiste-002.epub"
            }
        ];

        const LEXICON = {
            "propriété": { title: "Propriété", definition: "Pour Proudhon, 'la propriété, c'est le vol' lorsqu'elle permet de tirer un revenu sans travail." },
            "anarchie": { title: "Anarchie", definition: "Ordre sans pouvoir. Organisation sociale fondée sur la libre coopération des individus." },
            "commune": { title: "La Commune", definition: "Unité politique autonome de base, gérée par ses habitants." },
            "pain": { title: "Droit au Pain", definition: "Kropotkine affirme que le bien-être pour tous est le premier devoir de la révolution." },
            "entraide": { title: "Entraide", definition: "Facteur de l'évolution biologique et sociale, opposé à la seule compétition darwinienne." },
            "capital": { title: "Capital", definition: "Accumulation de travail autrui, permettant l'exploitation du salariat." },
            "révolution": { title: "Révolution Sociale", definition: "Transformation radicale des rapports de production et de propriété." }
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || typeof lucide === 'undefined') return;
                const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                const iconNode = lucide.icons[iconName];
                if (iconNode) {
                    ref.current.innerHTML = '';
                    const svg = lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('class', className);
                    ref.current.appendChild(svg);
                }
            }, [name, size, className]);
            return <span ref={ref} className="inline-flex shrink-0 items-center justify-center"></span>;
        };

        // --- COMPONENTS ---

        const Header = ({ onLogoClick, onAvatarClick, userAvatar }) => (
            <header className="sticky top-0 z-30 bg-[#fcfbf9]/95 backdrop-blur-md border-b border-stone-200/60 px-6 py-4 flex justify-between items-center shrink-0">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={onLogoClick}>
                    <div className="w-10 h-10 bg-red-900 rounded-sm flex items-center justify-center text-[#fdf6e3] shadow-md group-hover:bg-red-800 transition-colors">
                        <Icon name="library" size={20} />
                    </div>
                    <div>
                        <h1 className="font-brand font-bold text-xl tracking-wide text-stone-900 leading-none">NADAPROD BOOKS</h1>
                        <span className="text-[10px] uppercase tracking-[0.2em] text-red-900 font-bold">L'archive libre</span>
                    </div>
                </div>
                <div 
                    className="w-10 h-10 rounded-md bg-stone-200 overflow-hidden border border-stone-300 cursor-pointer hover:border-red-800 transition-colors shadow-sm"
                    onClick={onAvatarClick}
                >
                    <img src={userAvatar || "https://api.dicebear.com/7.x/notionists/svg?seed=Marx"} alt="User" className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500"/>
                </div>
            </header>
        );

        const UserProfile = ({ onBackHome, onOpenBook }) => {
            const [avatar, setAvatar] = useState(() => localStorage.getItem('wf_avatar'));
            const [history, setHistory] = useState([]);

            useEffect(() => {
                const books = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('wf_notes_')) {
                        const title = key.replace('wf_notes_', '');
                        const notes = JSON.parse(localStorage.getItem(key));
                        const progress = localStorage.getItem(`wf_progress_${title}`);
                        const serverBook = SERVER_LIBRARY.find(b => b.title === title);
                        books.push({ title, notesCount: notes.length, progress: progress ? "Étude en cours" : "Non consulté", isServer: !!serverBook, bookData: serverBook });
                    }
                }
                setHistory(books);
            }, []);

            const handleCopyNotes = (title) => {
                const notes = localStorage.getItem(`wf_notes_${title}`);
                if (notes) {
                    const parsed = JSON.parse(notes);
                    const text = parsed.map(n => `> "${n.text}"\n   — ${new Date(n.id).toLocaleDateString()}`).join('\n\n');
                    const textArea = document.createElement("textarea");
                    textArea.value = `EXTRAITS DE : ${title.toUpperCase()}\n--------------------------\n\n${text}`;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try { document.execCommand('copy'); alert("Extraits copiés."); } catch (err) {}
                    document.body.removeChild(textArea);
                }
            };

            return (
                <div className="h-full w-full flex flex-col bg-[#fcfbf9] archive-texture">
                    <Header onLogoClick={onBackHome} onAvatarClick={() => {}} userAvatar={avatar} />
                    <main className="flex-1 overflow-y-auto p-6 scrollbar-hide pb-20">
                        <div className="max-w-4xl mx-auto space-y-12">
                            <section className="flex flex-col md:flex-row items-center gap-8 bg-white/50 p-8 rounded-sm shadow-sm border border-stone-200 backdrop-blur-sm">
                                <div className="w-32 h-32 rounded-sm overflow-hidden border-2 border-stone-200 shadow-lg grayscale shrink-0">
                                    <img src={avatar || "https://api.dicebear.com/7.x/notionists/svg?seed=Marx"} className="w-full h-full object-cover" />
                                </div>
                                <div className="text-center md:text-left flex-1">
                                    <h2 className="text-3xl font-brand font-bold text-stone-900 mb-1">Chercheur</h2>
                                    <p className="text-stone-500 font-serif italic mb-6">"L'étude est une forme de résistance."</p>
                                    <div className="flex gap-6 justify-center md:justify-start">
                                        <div className="text-center">
                                            <div className="text-2xl font-brand font-bold text-red-900">{history.length}</div>
                                            <div className="text-[10px] text-stone-600 uppercase tracking-widest">Volumes</div>
                                        </div>
                                        <div className="w-px bg-stone-300"></div>
                                        <div className="text-center">
                                            <div className="text-2xl font-brand font-bold text-stone-800">{history.reduce((acc, curr) => acc + curr.notesCount, 0)}</div>
                                            <div className="text-[10px] text-stone-600 uppercase tracking-widest">Annotations</div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <section>
                                <h3 className="font-brand font-bold text-xl text-stone-800 mb-6 border-b-2 border-red-900/10 pb-2 inline-block">Registre</h3>
                                <div className="grid gap-3">
                                    {history.length === 0 && <p className="text-stone-400 font-serif italic text-center py-10">Les archives sont vierges.</p>}
                                    {history.map((book, idx) => (
                                        <div key={idx} className="bg-white p-5 rounded-sm shadow-sm border border-stone-100 flex flex-col sm:flex-row items-center justify-between gap-4 hover:border-red-900/30 transition-colors group">
                                            <div className="flex items-center gap-5 w-full sm:w-auto">
                                                <div className="w-12 h-16 bg-stone-800 rounded-sm shadow-md flex items-center justify-center text-stone-500 font-serif shrink-0"><span className="font-brand font-bold text-lg text-stone-300">{book.title.charAt(0)}</span></div>
                                                <div>
                                                    <h4 className="font-serif font-bold text-stone-900 text-lg line-clamp-1">{book.title}</h4>
                                                    <div className="text-xs text-stone-500 flex gap-3 mt-1 uppercase tracking-wider"><span className={book.progress === "Étude en cours" ? "text-red-800 font-bold" : ""}>{book.progress}</span><span>•</span><span>{book.notesCount} notes</span></div>
                                                </div>
                                            </div>
                                            <div className="flex gap-3 w-full sm:w-auto">
                                                <button onClick={() => handleCopyNotes(book.title)} className="flex-1 sm:flex-none px-4 py-2 border border-stone-200 text-stone-600 rounded-sm text-xs font-bold uppercase tracking-wide hover:bg-stone-50 transition-colors"><Icon name="scroll" size={14} className="mr-2 inline"/> Extraire</button>
                                                <button onClick={() => book.isServer && onOpenBook(book.bookData)} className={`flex-1 sm:flex-none px-6 py-2 rounded-sm text-xs font-bold uppercase tracking-wide text-white transition-colors ${book.isServer ? 'bg-stone-900 hover:bg-red-900 shadow-md' : 'bg-stone-300 cursor-not-allowed'}`}>Consulter</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </main>
                </div>
            );
        };

        const ReaderSettings = ({ isOpen, onClose, settings, onUpdate }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute bottom-24 right-4 w-72 bg-[#fcfbf9] border border-stone-300 shadow-2xl rounded-sm p-5 z-50 animate-slide-up max-h-[70vh] overflow-y-auto">
                    <div className="space-y-6">
                        {/* Theme */}
                        <div>
                            <div className="text-[10px] font-bold text-red-900 uppercase tracking-widest mb-3 border-b border-stone-200 pb-1">Papier & Encre</div>
                            <div className="flex gap-2">
                                {[{ id: 'light', bg: 'bg-[#fcfbf9]', border: 'border-stone-200', text: 'text-stone-900', label: 'Vélin' },{ id: 'sepia', bg: 'bg-[#eee4d1]', border: 'border-[#dccab0]', text: 'text-[#5f4b32]', label: 'Parchemin' },{ id: 'dark', bg: 'bg-[#1c1917]', border: 'border-stone-700', text: 'text-stone-300', label: 'Encre' }].map(t => (
                                    <button key={t.id} onClick={() => onUpdate({ ...settings, theme: t.id })} className={`flex-1 py-3 rounded-sm border flex flex-col items-center justify-center gap-1 transition-all ${t.bg} ${t.border} ${t.text} ${settings.theme === t.id ? 'ring-1 ring-red-900 shadow-inner' : 'hover:shadow-md'}`}>
                                        <span className="font-serif text-xl font-bold">Aa</span>
                                        <span className="text-[9px] uppercase font-bold tracking-widest opacity-70">{t.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Font Size */}
                        <div>
                            <div className="text-[10px] font-bold text-red-900 uppercase tracking-widest mb-3 border-b border-stone-200 pb-1">Taille</div>
                            <div className="flex items-center gap-3 bg-stone-100 rounded-sm p-1 border border-stone-200">
                                <button onClick={() => onUpdate({ ...settings, fontSize: Math.max(14, settings.fontSize - 2) })} className="w-8 h-8 rounded-sm bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-600 hover:text-red-900"><Icon name="minus" size={14} /></button>
                                <div className="flex-1 text-center font-serif font-bold text-stone-700 text-sm">{settings.fontSize}px</div>
                                <button onClick={() => onUpdate({ ...settings, fontSize: Math.min(32, settings.fontSize + 2) })} className="w-8 h-8 rounded-sm bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-600 hover:text-red-900"><Icon name="plus" size={14} /></button>
                            </div>
                        </div>

                        {/* Font Family Selection */}
                        <div>
                            <div className="text-[10px] font-bold text-red-900 uppercase tracking-widest mb-3 border-b border-stone-200 pb-1">Caractère</div>
                            <div className="grid grid-cols-2 gap-2">
                                {[
                                    { name: "Lora, serif", label: "Lora" },
                                    { name: "Syne, serif", label: "Syne" },
                                    { name: "Raleway, sans-serif", label: "Raleway" },
                                    { name: "Schoolbell, cursive", label: "Schoolbell" },
                                ].map(font => (
                                    <button 
                                        key={font.name}
                                        onClick={() => onUpdate({ ...settings, fontFamily: font.name })}
                                        className={`px-2 py-2 text-xs rounded-sm border transition-all ${settings.fontFamily === font.name ? 'bg-red-900 text-white border-red-900' : 'bg-white text-stone-700 border-stone-200 hover:border-red-900'}`}
                                        style={{ fontFamily: font.name }}
                                    >
                                        {font.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SelectionMenu = ({ position, onAnnotate, onClose, onCopy, onDelete, isEditing }) => {
            if (!position) return null;
            
            // Boundary check logic could be added here if needed for mobile edges
            return (
                <div 
                    className="fixed z-50 flex items-center gap-1 p-1 bg-stone-900 text-[#fcfbf9] rounded-sm shadow-2xl animate-bounce-in border border-stone-700"
                    style={{ top: position.y - 60, left: position.x, transform: 'translateX(-50%)' }}
                    onMouseDown={(e) => e.stopPropagation()} 
                    onClick={(e) => e.stopPropagation()}
                >
                    <button onClick={onCopy} className="p-2 hover:bg-stone-700 rounded-sm transition-colors" title="Copier"><Icon name="copy" size={18}/></button>
                    <div className="w-px h-4 bg-stone-700 mx-1"></div>
                    <button onClick={onAnnotate} className="p-2 hover:bg-stone-700 rounded-sm transition-colors text-red-400" title="Annoter"><Icon name="pen-tool" size={18}/></button>
                    {isEditing && (<><div className="w-px h-4 bg-stone-700 mx-1"></div><button onClick={onDelete} className="p-2 hover:bg-red-900/50 text-red-500 rounded-sm transition-colors" title="Effacer"><Icon name="trash-2" size={18}/></button></>)}
                    {!isEditing && (<button onClick={onClose} className="p-2 hover:bg-stone-700 rounded-sm text-stone-500" title="Fermer"><Icon name="x" size={18}/></button>)}
                    <div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-stone-900 rotate-45 border-r border-b border-stone-700"></div>
                </div>
            );
        };

        const NoteInputModal = ({ isOpen, onClose, onSave, initialText = "" }) => {
            const [text, setText] = useState(initialText);
            const inputRef = useRef(null);
            useEffect(() => { if (isOpen) { setText(initialText); setTimeout(() => inputRef.current?.focus(), 100); } }, [isOpen, initialText]);
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-stone-900/60 backdrop-blur-sm p-4">
                    <div className="bg-[#fcfbf9] rounded-sm shadow-2xl w-full max-w-md p-6 animate-slide-up border border-stone-300 relative">
                        <div className="absolute top-0 left-0 w-full h-1 bg-red-900"></div>
                        <h3 className="text-lg font-brand font-bold mb-4 text-stone-900 flex items-center gap-2"><Icon name="pen-tool" size={18} className="text-red-900"/> Note Marginale</h3>
                        <textarea ref={inputRef} value={text} onChange={(e) => setText(e.target.value)} placeholder="Vos réflexions..." className="w-full h-40 bg-white border border-stone-300 rounded-sm p-4 text-sm font-serif leading-relaxed focus:outline-none focus:ring-1 focus:ring-red-900 focus:border-red-900 mb-6 resize-none shadow-inner"></textarea>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 text-stone-500 hover:text-stone-800 font-bold text-xs uppercase tracking-wide">Annuler</button>
                            <button onClick={() => onSave(text)} className="px-6 py-2 bg-stone-900 text-[#fcfbf9] rounded-sm font-bold text-xs uppercase tracking-widest hover:bg-red-900 transition-colors shadow-lg">Inscrire</button>
                        </div>
                    </div>
                </div>
            );
        };

        const NotesIndexDrawer = ({ isOpen, onClose, notes, onNoteClick, onDeleteNote }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute inset-y-0 right-0 w-full md:w-96 bg-[#fcfbf9] shadow-2xl z-50 transform transition-transform animate-slide-up md:animate-none flex flex-col border-l border-stone-300 h-full">
                    <div className="p-5 border-b border-stone-200 flex justify-between items-center bg-white/50 backdrop-blur shrink-0">
                        <h2 className="font-brand font-bold text-stone-900 flex items-center gap-2 text-lg"><span className="text-red-900">§</span> Annotations</h2>
                        <button onClick={onClose} className="p-1 hover:bg-stone-200 rounded-sm"><Icon name="x" size={20}/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-5 space-y-4 archive-texture pb-20">
                        {notes.length === 0 && (<div className="text-center mt-20 opacity-40"><Icon name="feather" size={40} className="mx-auto mb-3 text-stone-400"/><p className="font-serif italic text-stone-600">Aucune note inscrite.</p></div>)}
                        {notes.map((note) => (
                            <div key={note.cfi} onClick={() => onNoteClick(note.cfi)} className="p-4 bg-white rounded-sm border border-stone-200 cursor-pointer hover:border-red-900/50 hover:shadow-md transition-all group relative">
                                <div className="absolute left-0 top-0 bottom-0 w-1 bg-stone-200 group-hover:bg-red-900 transition-colors"></div>
                                <div className="pl-3">
                                    <p className="text-stone-800 font-serif text-sm leading-relaxed mb-3 line-clamp-4 italic">{note.text ? `"${note.text}"` : "..."}</p>
                                    <div className="flex justify-between items-center pt-2 border-t border-stone-100">
                                        <span className="text-[10px] font-bold text-stone-400 uppercase tracking-wider">{new Date(note.id).toLocaleDateString()}</span>
                                        <button onClick={(e) => { e.stopPropagation(); onDeleteNote(note.cfi); }} className="text-stone-300 hover:text-red-600 transition-colors"><Icon name="trash-2" size={14} /></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Library = ({ onBookSelect, onFileUpload, onAvatarClick, userAvatar }) => {
            const handleFileChange = (e) => { if (e.target.files[0]) onFileUpload(e.target.files[0]); };
            return (
                <div className="h-full w-full flex flex-col bg-[#fcfbf9] archive-texture">
                    <Header onLogoClick={() => {}} onAvatarClick={onAvatarClick} userAvatar={userAvatar} />
                    <main className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                        <div className="max-w-6xl mx-auto space-y-12 pb-20">
                            <section className="text-center py-10 border-b border-stone-200/60">
                                <h2 className="font-brand font-black text-4xl md:text-5xl text-stone-900 mb-4 tracking-tight">Le savoir est une arme</h2>
                                <p className="font-serif text-xl text-stone-600 italic max-w-2xl mx-auto">"L'instruction, comme la liberté, ne se donne pas : elle se prend."</p>
                            </section>
                            <section className="flex justify-center">
                                <label className="cursor-pointer group">
                                    <div className="flex items-center gap-4 px-8 py-4 bg-stone-100 border border-stone-300 rounded-sm hover:bg-white hover:border-red-900 hover:shadow-lg transition-all duration-300">
                                        <Icon name="upload-cloud" className="text-stone-500 group-hover:text-red-900" /><span className="font-bold text-stone-700 uppercase tracking-widest text-xs group-hover:text-stone-900">Importer un EPUB personnel</span>
                                    </div>
                                    <input type="file" accept=".epub" className="hidden" onChange={handleFileChange} />
                                </label>
                            </section>
                            <section>
                                <div className="flex items-end justify-between mb-8 border-b border-stone-300 pb-2">
                                    <h2 className="font-brand font-bold text-2xl text-stone-900">Collection Classique</h2><span className="font-serif italic text-stone-500 text-sm">XIXe - XXe Siècle</span>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-x-8 gap-y-12">
                                    {SERVER_LIBRARY.map(book => (
                                        <div key={book.id} onClick={() => onBookSelect(book)} className="group cursor-pointer flex flex-col gap-4 perspective-1000">
                                            <div className={`aspect-[2/3] rounded-sm shadow-md group-hover:shadow-2xl group-hover:-translate-y-2 transition-all duration-500 relative overflow-hidden bg-gradient-to-br ${book.cover_gradient} border-r-4 border-b-4 border-black/20`}>
                                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/leather.png')] opacity-30 mix-blend-overlay"></div>
                                                <div className="absolute top-0 left-3 bottom-0 w-[2px] bg-white/10 shadow-[0_0_10px_rgba(0,0,0,0.5)]"></div>
                                                <div className="absolute inset-0 p-4 flex flex-col justify-between text-[#fcfbf9] z-10">
                                                    <div className="text-center mt-4"><h3 className="font-brand font-bold text-lg leading-tight drop-shadow-md uppercase border-b border-white/30 pb-2 inline-block line-clamp-3">{book.title}</h3></div>
                                                    <div className="text-center mb-6"><p className="font-serif italic text-xs opacity-90">{book.author}</p></div>
                                                </div>
                                                <div className="absolute inset-0 bg-stone-900/40 opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-[2px] flex items-center justify-center">
                                                    <div className="w-12 h-12 rounded-full border-2 border-[#fcfbf9] flex items-center justify-center text-[#fcfbf9]"><Icon name="book-open" /></div>
                                                </div>
                                            </div>
                                            <div className="text-center px-2">
                                                <div className="h-1 w-8 bg-red-900 mx-auto mb-2 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                <h4 className="font-serif font-bold text-stone-900 text-sm line-clamp-2 leading-tight group-hover:text-red-900 transition-colors">{book.title}</h4>
                                                <p className="text-stone-500 text-xs mt-1 uppercase tracking-wider">{book.author.split(' ').pop()}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </main>
                </div>
            );
        };

        const ContextBridge = ({ term, onClose }) => {
            if (!term) return null;
            const data = LEXICON[term.toLowerCase()] || { title: term, definition: "Terme non indexé dans ce volume." };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center pointer-events-none p-4">
                    <div className="absolute inset-0 bg-stone-900/20 backdrop-blur-sm pointer-events-auto transition-opacity" onClick={onClose}></div>
                    <div className="w-full max-w-md bg-[#fcfbf9] p-8 rounded-sm shadow-2xl pointer-events-auto animate-slide-up relative border-2 border-stone-800">
                        <div className="absolute top-2 left-2 w-full h-full border border-stone-300 -z-10 bg-white"></div>
                        <div className="flex justify-between items-start mb-6 border-b border-stone-300 pb-2">
                            <span className="font-brand font-bold text-red-900 text-xl uppercase tracking-widest">{data.title}</span>
                            <button onClick={onClose} className="text-stone-400 hover:text-stone-900"><Icon name="x" size={20} /></button>
                        </div>
                        <p className="font-serif text-stone-800 text-lg leading-relaxed italic">"{data.definition}"</p>
                        <div className="mt-6 flex justify-end"><span className="text-[10px] uppercase font-bold text-stone-400 tracking-widest">Dictionnaire Politique</span></div>
                    </div>
                </div>
            );
        };

        // 9. EPUB READER ENGINE (FIXED)
        const EpubReader = ({ bookData, bookTitle, onExit }) => {
            const viewerRef = useRef(null);
            const renditionRef = useRef(null);
            const bookRef = useRef(null);
            
            const [isReady, setIsReady] = useState(false);
            const [userNotes, setUserNotes] = useState(() => {
                const saved = localStorage.getItem(`wf_notes_${bookTitle}`);
                return saved ? JSON.parse(saved) : [];
            });
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('wf_settings');
                return saved ? JSON.parse(saved) : { theme: 'sepia', fontSize: 18, fontFamily: "'Lora', serif" };
            });

            const [showControls, setShowControls] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [showNotesIndex, setShowNotesIndex] = useState(false);
            const [selectionMenuPos, setSelectionMenuPos] = useState(null); 
            const [pendingSelectionCfi, setPendingSelectionCfi] = useState(null);
            const [activeTerm, setActiveTerm] = useState(null);
            const [isNoteModalOpen, setNoteModalOpen] = useState(false);
            const [selectedCfi, setSelectedCfi] = useState(null);
            const [editingNoteText, setEditingNoteText] = useState("");

            useEffect(() => localStorage.setItem('wf_settings', JSON.stringify(settings)), [settings]);
            useEffect(() => localStorage.setItem(`wf_notes_${bookTitle}`, JSON.stringify(userNotes)), [userNotes, bookTitle]);

            // --- GLOBAL KEYBOARD NAVIGATION (Main Window) ---
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tagName = document.activeElement?.tagName?.toLowerCase();
                    if (tagName === 'input' || tagName === 'textarea') return;
                    if (e.key === "ArrowLeft" || e.key === "Left") renditionRef.current?.prev();
                    if (e.key === "ArrowRight" || e.key === "Right") renditionRef.current?.next();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // --- THEME & FONT UPDATE EFFECT ---
            useEffect(() => {
                if (renditionRef.current) {
                    renditionRef.current.themes.select(settings.theme);
                    renditionRef.current.themes.fontSize(`${settings.fontSize}px`);
                    renditionRef.current.themes.font(settings.fontFamily);
                    const contents = renditionRef.current.getContents();
                    contents.forEach(c => {
                         c.addStylesheetRules({ "body, p, span, div, li": { "font-family": `${settings.fontFamily} !important` } });
                    });
                }
            }, [settings]);

            useEffect(() => {
                if (!bookData || typeof window.ePub === 'undefined') return;
                
                if (viewerRef.current) viewerRef.current.innerHTML = '';
                
                const book = window.ePub(bookData);
                bookRef.current = book;
                const savedLocation = localStorage.getItem(`wf_progress_${bookTitle}`);
                
                const rendition = book.renderTo(viewerRef.current, { width: "100%", height: "100%", flow: "paginated", allowScriptedContent: true });
                renditionRef.current = rendition;

                rendition.themes.register('light', { body: { color: '#1c1917', background: '#fcfbf9' }, '::selection': { background: '#fecaca' } });
                rendition.themes.register('sepia', { body: { color: '#451a03', background: '#eee4d1' }, '::selection': { background: '#d6c096' } });
                rendition.themes.register('dark', { body: { color: '#a8a29e', background: '#1c1917' }, '::selection': { background: '#7f1d1d' } });
                
                rendition.themes.fontSize(`${settings.fontSize}px`);

                rendition.hooks.content.register((contents) => {
                    const doc = contents.document;
                    
                    const link = doc.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Syne:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;700&family=Schoolbell&family=Inter:wght@300;400;500;600&display=swap';
                    doc.head.appendChild(link);
                    
                    const style = doc.createElement('style');
                    style.innerHTML = `body { padding: 40px 80px !important; max-width: 900px; margin: 0 auto; } @media (max-width: 640px) { body { padding: 20px 20px !important; } }`;
                    doc.head.appendChild(style);

                    contents.addStylesheetRules({
                        "body": { "font-family": `${settings.fontFamily} !important`, "line-height": "1.7 !important" },
                        "p, span, div, li": { "font-family": `${settings.fontFamily} !important` },
                        "h1, h2, h3": { "font-family": "'Cinzel', serif !important", "font-weight": "700 !important" },
                        ".wf-highlight": { "border-bottom": "2px solid #991b1b", "background-color": "rgba(153, 27, 27, 0.1)", "cursor": "pointer" }
                    });

                    if (contents.sectionIndex !== 0) {
                        const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
                        const nodes = [];
                        while(walker.nextNode()) nodes.push(walker.currentNode);
                        nodes.forEach(node => {
                            let html = node.nodeValue;
                            let changed = false;
                            Object.keys(LEXICON).forEach(term => {
                                const regex = new RegExp(`\\b(${term})\\b`, 'gi');
                                if (regex.test(html)) { html = html.replace(regex, `<span class="wf-highlight" style="border-bottom: 1px dashed #7f1d1d; background: transparent;" data-term="$1">$1</span>`); changed = true; }
                            });
                            if (changed) { const span = doc.createElement('span'); span.innerHTML = html; node.parentNode.replaceChild(span, node); }
                        });
                    }

                    // --- FIX 2: KEYBOARD INSIDE IFRAME (ROBUST) ---
                    contents.window.addEventListener('keydown', (e) => {
                        if (e.key === "ArrowLeft" || e.key === "Left") rendition.prev();
                        if (e.key === "ArrowRight" || e.key === "Right") rendition.next();
                    });

                    doc.addEventListener('click', (e) => {
                        if (e.target.dataset.term) { setActiveTerm(e.target.dataset.term); setSelectionMenuPos(null); }
                        else {
                            const width = contents.window.innerWidth;
                            if (e.clientX < width * 0.3) rendition.prev();
                            else if (e.clientX > width * 0.7) rendition.next();
                            else setShowControls(p => !p);
                        }
                    });
                });

                rendition.on('selected', (cfiRange, contents) => {
                    const sel = contents.window.getSelection();
                    if (sel.rangeCount > 0) {
                        const rect = sel.getRangeAt(0).getBoundingClientRect();
                        const iframeRect = contents.document.defaultView.frameElement.getBoundingClientRect();
                        setPendingSelectionCfi(cfiRange);
                        setSelectionMenuPos({ x: rect.left + (rect.width/2) + iframeRect.left, y: rect.top + iframeRect.top });
                    }
                });

                rendition.on('markClicked', (cfiRange) => {
                    const note = userNotes.find(n => n.cfi === cfiRange);
                    if (note) { setSelectedCfi(cfiRange); setEditingNoteText(note.text); setNoteModalOpen(true); setSelectionMenuPos(null); }
                });

                rendition.on('relocated', (location) => { if (location?.start) localStorage.setItem(`wf_progress_${bookTitle}`, location.start.cfi); });

                rendition.display(savedLocation || undefined).then(() => {
                    setIsReady(true);
                    rendition.themes.select(settings.theme);
                    userNotes.forEach(note => rendition.annotations.add('highlight', note.cfi));
                });

                return () => { if (bookRef.current) bookRef.current.destroy(); };
            }, [bookData]);

            const handleSaveNote = (text) => {
                const cfi = selectedCfi || pendingSelectionCfi;
                const existingIdx = userNotes.findIndex(n => n.cfi === cfi);
                if (existingIdx >= 0) { const updated = [...userNotes]; updated[existingIdx].text = text; setUserNotes(updated); }
                else { setUserNotes([...userNotes, { id: Date.now(), cfi, text }]); renditionRef.current.annotations.add('highlight', cfi); }
                setNoteModalOpen(false); setSelectionMenuPos(null); renditionRef.current.getContents()[0].window.getSelection().removeAllRanges();
            };

            const handleDeleteNote = (cfi) => {
                const target = cfi || selectedCfi;
                setUserNotes(userNotes.filter(n => n.cfi !== target));
                renditionRef.current.annotations.remove(target, 'highlight');
                setNoteModalOpen(false);
                setSelectionMenuPos(null);
            };

            const getContainerBg = () => {
                if (settings.theme === 'dark') return 'bg-[#1c1917]';
                if (settings.theme === 'sepia') return 'bg-[#eee4d1]';
                return 'bg-[#fcfbf9]';
            };

            return (
                <div className={`h-full w-full relative flex flex-col transition-colors duration-500 ${getContainerBg()} archive-texture overflow-hidden`}>
                    <div className={`absolute top-0 left-0 w-full p-4 flex justify-between items-center z-30 transition-transform duration-300 ${showControls ? 'translate-y-0' : '-translate-y-full'}`}>
                        <button onClick={onExit} className="p-2 bg-stone-900 text-[#fcfbf9] rounded-sm shadow-md hover:bg-red-900 transition-colors"><Icon name="arrow-left" /></button>
                        <div className="flex gap-2">
                             <button onClick={() => { setShowNotesIndex(true); setShowControls(false); }} className="p-2 bg-[#fcfbf9] text-stone-900 rounded-sm shadow-md border border-stone-300 hover:border-red-900"><Icon name="bookmark" /></button>
                             <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-[#fcfbf9] text-stone-900 rounded-sm shadow-md border border-stone-300 hover:border-red-900"><Icon name="type" /></button>
                        </div>
                    </div>
                    <div className="flex-1 flex items-center justify-center p-0 md:p-10 w-full relative z-0 overflow-hidden">
                        <div ref={viewerRef} className={`w-full h-full md:w-auto md:h-[90vh] md:aspect-[3/4] md:rounded-sm md:overflow-hidden book-shadow transition-all duration-500 ${settings.theme === 'dark' ? 'bg-[#1c1917]' : (settings.theme === 'sepia' ? 'bg-[#eee4d1]' : 'bg-[#fcfbf9]')}`}></div>
                        <SelectionMenu position={selectionMenuPos} onAnnotate={() => { setNoteModalOpen(true); setSelectedCfi(pendingSelectionCfi); setEditingNoteText(""); }} onCopy={() => { renditionRef.current.getContents()[0].document.execCommand('copy'); setSelectionMenuPos(null); }} onClose={() => setSelectionMenuPos(null)} />
                    </div>
                    <ReaderSettings isOpen={showSettings} onClose={() => setShowSettings(false)} settings={settings} onUpdate={setSettings} />
                    <NoteInputModal isOpen={isNoteModalOpen} onClose={() => setNoteModalOpen(false)} onSave={handleSaveNote} initialText={editingNoteText} />
                    <NotesIndexDrawer isOpen={showNotesIndex} onClose={() => setShowNotesIndex(false)} notes={userNotes} onNoteClick={(cfi) => { renditionRef.current.display(cfi); setShowNotesIndex(false); }} onDeleteNote={handleDeleteNote} />
                    <ContextBridge term={activeTerm} onClose={() => setActiveTerm(null)} />
                    <div className={`fixed bottom-6 left-0 w-full flex justify-center z-30 pointer-events-none transition-transform duration-300 ${showControls ? 'translate-y-0' : 'translate-y-24'}`}>
                        <div className={`backdrop-blur-md rounded-full shadow-xl px-6 py-2 flex justify-between items-center pointer-events-auto border gap-8 ${settings.theme === 'dark' ? 'bg-black/80 border-white/10 text-stone-300' : 'bg-white/90 border-stone-200 text-stone-900'}`}>
                             <button onClick={(e) => { e.stopPropagation(); renditionRef.current?.prev(); }} className="hover:text-red-600 active:scale-95 transition-transform"><Icon name="chevron-left" /></button>
                             <span className="text-[10px] font-bold uppercase tracking-widest opacity-60 min-w-[80px] text-center">{isReady ? "Lecture" : "..."}</span>
                             <button onClick={(e) => { e.stopPropagation(); renditionRef.current?.next(); }} className="hover:text-red-600 active:scale-95 transition-transform"><Icon name="chevron-right" /></button>
                        </div>
                    </div>
                    {!isReady && <div className="absolute inset-0 z-50 flex items-center justify-center bg-[#fcfbf9]"><div className="w-12 h-12 border-4 border-stone-300 border-t-red-900 rounded-full animate-spin"></div></div>}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('library');
            const [currentBook, setCurrentBook] = useState(null);
            const [bookTitle, setBookTitle] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            const loadBook = async (book) => {
                if(!book.url && !book.data) { alert("Livre non disponible."); return; }
                setIsLoading(true);
                try {
                    let data = book.data;
                    if(!data) { const res = await fetch(book.url); data = await res.arrayBuffer(); }
                    setCurrentBook(data); setBookTitle(book.title); setView('reader');
                } catch(e) { alert("Erreur de chargement."); } finally { setIsLoading(false); }
            };

            if (isLoading) return <div className="h-screen w-full flex items-center justify-center bg-[#fcfbf9] font-brand text-red-900 animate-pulse text-xl">Ouverture des Archives...</div>;
            if (view === 'reader') return <EpubReader bookData={currentBook} bookTitle={bookTitle} onExit={() => setView('library')} />;
            if (view === 'profile') return <UserProfile onBackHome={() => setView('library')} onOpenBook={(bk) => loadBook(bk)} />;
            return <Library onBookSelect={loadBook} onFileUpload={(f) => { const r = new FileReader(); r.onload = (e) => loadBook({data: e.target.result, title: f.name}); r.readAsArrayBuffer(f); }} onAvatarClick={() => setView('profile')} userAvatar={null} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
