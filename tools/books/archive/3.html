<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NADAPROD BOOKS - Underground</title>
<meta name="description" content="L'instruction, comme la liberté, ne se donne pas : elle se prend.">

<!-- PWA Setup -->
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="NADAPROD BOOKS">

<!-- Icons -->
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">

<!-- Manifest Data URI -->
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NADAPROD BOOKS%22%2C%22short_name%22%3A%22NADAPROD BOOKS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3389%2F3389081.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D'>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Schoolbell:wght@300;400;500;600;700;800&family=Syne:wght@300;400;500;600;700;800&family=Lora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                    display: ['"Bebas Neue"', 'sans-serif'],
                    mono: ['monospace'],
                    serif: ['Lora', 'serif', 'Georgia'],
                    hand: ['Schoolbell', 'cursive'],
                },
                colors: {
                    nada: {
                        bg: '#000000',
                        surface: '#0a0a0a',
                        border: '#333333',
                        accent: 'var(--accent)', 
                        text: '#f0f0f0',
                        dim: '#666666'
                    }
                },
                boxShadow: {
                    'hard': '4px 4px 0px rgba(30, 30, 30, 1)',
                    'hard-accent': '4px 4px 0px var(--accent)',
                },
                animation: {
                    'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                    'fade-in': 'fadeIn 0.5s ease-out',
                },
                keyframes: {
                    slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
                    fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
                }
            }
        }
    }
</script>

<!-- Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    :root {
        --accent: #ccff00;
        --accent-glow: drop-shadow(0 0 4px var(--accent)); 
        --bg: #000000;
        --scanline-opacity: 0.03;
    }

    html, body { 
        height: 100%; height: 100dvh;
        overflow: hidden;
        background-color: var(--bg); color: #f0f0f0;
        -webkit-tap-highlight-color: transparent; 
        overscroll-behavior: none;
    }
    
    .crt-overlay {
        position: fixed; inset: 0; pointer-events: none; z-index: 9999;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
        background-size: 100% 4px; opacity: var(--scanline-opacity);
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    ::selection { background: var(--accent); color: #000; }

    .wf-highlight { background: var(--accent); color: #000; padding: 0 2px; font-weight: bold; cursor: pointer; }

    /* Gravure / Etched Effect on Dark Mode */
    .border-etched {
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 
            inset 0 0 0 1px rgba(0,0,0,1), 
            inset 0 0 0 2px rgba(255,255,255,0.1);
    }
</style>
</head>
<body>
    <div class="crt-overlay"></div>
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA ---
        const SERVER_LIBRARY = [
            {
                id: "new_01",
                title: "Révolutionnaires , anarchiste , fouteur de merde , qui sommes nous ?",
                author: "Isia Rose",
                year: "2024",
                theme_color: "border-etched", 
                url: "/dl/isia-rose-revolutionnaires-anarchiste-fouteur-de-merde-qui-sommes-nous.epub"
            },
            {
                id: "bk_arch_01",
                title: "La Conquête du Pain",
                author: "Pierre Kropotkine",
                year: "1892",
                theme_color: "border-white",
                url: "/dl/pierre-kropotkine-la-conquete-du-pain.epub"
            },
            {
                id: "bk_arch_02",
                title: "Qu'est-ce que la propriété ?",
                author: "Pierre-Joseph Proudhon",
                year: "1840",
                theme_color: "border-nada-dim",
                url: "/dl/pierre-joseph-proudhon-qu-est-ce-que-la-propriete-fr.epub"
            },
            {
                id: "bk_arch_03",
                title: "Mémoires",
                author: "Louise Michel",
                year: "1886",
                theme_color: "border-etched",
                url: "https://files.gutenberg.org/cache/epub/14022/pg14022.epub"
            },
            {
                id: "bk_arch_04",
                title: "L'Évolution, la Révolution...",
                author: "Élisée Reclus",
                year: "1898",
                theme_color: "border-white",
                url: "https://files.gutenberg.org/cache/epub/26605/pg26605.epub"
            },
            {
                id: "bk_server_02",
                title: "L'ANARCHIE. 1896",
                author: "Élisée Reclus",
                year: "1896",
                theme_color: "border-nada-dim",
                url: "/dl/lanarchiste-001.epub"
            },
            {
                id: "bk_server_03",
                title: "L'Encyclopédie anarchiste",
                author: "Sébastien Faure",
                year: "1934",
                theme_color: "border-etched",
                url: "/dl/lanarchiste-002.epub"
            }
        ];

        const LEXICON = {
            "propriété": { title: "Propriété", definition: "Pour Proudhon, 'la propriété, c'est le vol' lorsqu'elle permet de tirer un revenu sans travail." },
            "anarchie": { title: "Anarchie", definition: "Ordre sans pouvoir. Organisation sociale fondée sur la libre coopération des individus." },
            "commune": { title: "La Commune", definition: "Unité politique autonome de base, gérée par ses habitants." },
            "pain": { title: "Droit au Pain", definition: "Kropotkine affirme que le bien-être pour tous est le premier devoir de la révolution." }
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || typeof lucide === 'undefined') return;
                const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                const iconNode = lucide.icons[iconName];
                if (iconNode) {
                    ref.current.innerHTML = '';
                    const svg = lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('class', className);
                    ref.current.appendChild(svg);
                }
            }, [name, size, className]);
            return <span ref={ref} className="inline-flex shrink-0 items-center justify-center"></span>;
        };

        // --- COMPONENTS ---

        const Header = ({ onLogoClick, onAvatarClick, userAvatar }) => (
            <header className="sticky w-full max-w-7xl mx-auto top-0 z-30 bg-nada-bg backdrop-blur-md  border-nada-border px-4 xl:px-0 py-2 lg:py-4 flex justify-between items-center shrink-0 shadow shadow-black shadow-lg">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={onLogoClick}>
                    <div>
                        <img src="/gfx/logo.png" class="h-16 lg:h-20 xl:h-24" />
                    </div>
                </div>
                <div 
                    className="w-10 h-10 rounded-[2px] bg-nada-surface overflow-hidden border-2 border-nada-border cursor-pointer hover:border-etched transition-colors"
                    onClick={onAvatarClick}
                >
                    <img src={userAvatar || "https://api.dicebear.com/7.x/notionists/svg?seed=Marx"} alt="User" className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500"/>
                </div>
            </header>
        );

        const UserProfile = ({ onBackHome, onOpenBook }) => {
            const [avatar, setAvatar] = useState(() => localStorage.getItem('wf_avatar'));
            const [history, setHistory] = useState([]);

            useEffect(() => {
                const books = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('wf_notes_')) {
                        const title = key.replace('wf_notes_', '');
                        const notes = JSON.parse(localStorage.getItem(key));
                        const progress = localStorage.getItem(`wf_progress_${title}`);
                        const serverBook = SERVER_LIBRARY.find(b => b.title === title);
                        books.push({ title, notesCount: notes.length, progress: progress ? "ACTIF" : "N/A", isServer: !!serverBook, bookData: serverBook });
                    }
                }
                setHistory(books);
            }, []);

            return (
                <div className="h-full w-full flex flex-col bg-nada-bg">
                    <Header onLogoClick={onBackHome} onAvatarClick={() => {}} userAvatar={avatar} />
                    <main className="flex-1 overflow-y-auto p-6 scrollbar-hide pb-20">
                        <div className="max-w-4xl mx-auto space-y-8">
                            <section className="bg-nada-surface p-6 border-2 border-nada-border shadow-hard flex gap-6 items-center">
                                <div className="w-24 h-24 border border-white grayscale shrink-0"><img src={avatar || "https://api.dicebear.com/7.x/notionists/svg?seed=Marx"} className="w-full h-full object-cover" /></div>
                                <div>
                                    <span className="bg-nada-accent text-black px-1 font-mono text-xs font-bold">OPÉRATEUR</span>
                                    <h2 className="text-3xl font-display text-white mt-1">CHERCHEUR</h2>
                                    <div className="flex gap-4 mt-4 text-nada-dim font-mono text-xs">
                                        <div>VOLUMES: <span className="text-white">{history.length}</span></div>
                                        <div>DATA: <span className="text-white">{history.reduce((a,c)=>a+c.notesCount,0)}</span></div>
                                    </div>
                                </div>
                            </section>
                            
                            <h3 className="font-display text-2xl text-nada-dim border-b border-nada-border pb-2">REGISTRE</h3>
                            <div className="grid gap-3">
                                {history.map((book, idx) => (
                                    <div key={idx} className="bg-[#050505] p-4 border border-nada-border flex justify-between items-center hover:border-nada-accent transition-colors group">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 bg-nada-surface border border-nada-dim flex items-center justify-center text-nada-accent font-display">{book.title.charAt(0)}</div>
                                            <div>
                                                <div className="font-sans font-bold text-white text-sm line-clamp-1">{book.title}</div>
                                                <div className="text-[10px] font-mono text-nada-dim">{book.notesCount} ENTRÉES</div>
                                            </div>
                                        </div>
                                        <button onClick={() => book.isServer && onOpenBook(book.bookData)} className="px-4 py-2 border border-nada-dim text-xs font-mono hover:bg-white hover:text-black transition-colors">OUVRIR</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // --- LIBRARY WITH ROTATED BOOKS ---
        const Library = ({ onBookSelect, onFileUpload, onAvatarClick, userAvatar }) => {
            const handleFileChange = (e) => { if (e.target.files[0]) onFileUpload(e.target.files[0]); };
            return (
                <div className="h-full w-full flex flex-col bg-nada-bg archive-texture">
                    <Header onLogoClick={() => {}} onAvatarClick={onAvatarClick} userAvatar={userAvatar} />
                    <main className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                        <div className="max-w-7xl mx-auto space-y-12 pb-20">
                            <section className="py-8 border-b border-nada-border">
                                <h2 className="font-display text-6xl md:text-8xl text-white mb-2 tracking-tighter" style={{ textShadow: "4px 4px 0 #333" }}>
                                    <span className="text-transparent" style={{ WebkitTextStroke: '1px white'}}>{SERVER_LIBRARY.length} VOLUMES</span>
                                </h2>
                                <p className="font-mono text-nada-accent uppercase text-xs tracking-widest max-w-2xl bg-black inline-block px-2">SAVOIR = POUVOIR</p>
                            </section>

                            <section>
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8 gap-y-16 pt-10 px-4">
                                    {SERVER_LIBRARY.map((book, idx) => {
                                        // ROTATION LOGIC from previous iteration
                                        const rotationClass = ["rotate-1", "-rotate-2", "rotate-2", "-rotate-1", "rotate-[1.5deg]", "-rotate-[0.5deg]"][idx % 6];
                                        
                                        return (
                                            <div key={book.id} onClick={() => onBookSelect(book)} className={`group cursor-pointer flex flex-col gap-4 perspective-1000 ${rotationClass} hover:rotate-0 transition-transform duration-300`}>
                                                {/* BOOK COVER CONTAINER */}
                                                <div className="aspect-[2/3] relative bg-[#0a0a0a] shadow-hard hover:shadow-hard-accent transition-shadow duration-300">
                                                    
                                                    {/* "GRAVURE EN DÉLIÉ" (Fine white lines on black) */}
                                                    <div className="absolute inset-0 border border-white/20 pointer-events-none"></div>
                                                    <div className="absolute inset-1 border border-white/10 pointer-events-none"></div>
                                                    <div className="absolute inset-[6px] border border-white/5 pointer-events-none"></div>
                                                    
                                                    {/* Internal Layout */}
                                                    <div className="absolute inset-0 p-4 flex flex-col justify-between z-10">
                                                        <div className="border-b border-white/20 pb-2">
                                                            <span className="font-mono text-[8px] text-nada-accent block mb-1">ARCHIVE.REF.{idx+100}</span>
                                                            <h3 className="font-display text-2xl leading-none text-white uppercase break-words">{book.title}</h3>
                                                        </div>
                                                        <div>
                                                            <div className="w-8 h-8 border border-white/30 rounded-full flex items-center justify-center mb-2 mx-auto opacity-50">
                                                                <span className="font-serif italic text-white text-xs">Ex</span>
                                                            </div>
                                                            <p className="font-sans text-nada-dim text-[10px] uppercase font-bold text-center tracking-widest">{book.author}</p>
                                                            <p className="font-mono text-nada-accent text-[10px] text-center mt-1">{book.year}</p>
                                                        </div>
                                                    </div>

                                                    {/* Spine Shadow */}
                                                    <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-r from-white/20 to-transparent"></div>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* UPLOAD BUTTON AS A 'GHOST' BOOK */}
                                    <label className="cursor-pointer group flex flex-col gap-4 perspective-1000 rotate-1 hover:rotate-0 transition-transform">
                                        <div className="aspect-[2/3] relative bg-black border-2 border-dashed border-nada-dim hover:border-nada-accent flex flex-col items-center justify-center gap-2 transition-colors">
                                            <Icon name="upload-cloud" className="text-nada-dim group-hover:text-nada-accent" size={32} />
                                            <span className="font-mono text-[10px] text-nada-dim uppercase">IMPORT LOCAL</span>
                                            <input type="file" accept=".epub" className="hidden" onChange={handleFileChange} />
                                        </div>
                                    </label>
                                </div>
                            </section>
                        </div>
                    </main>
                </div>
            );
        };

        const ReaderSettings = ({ isOpen, onClose, settings, onUpdate }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute bottom-24 right-4 w-72 bg-black border-2 border-white shadow-hard z-50 animate-slide-up max-h-[70vh] overflow-y-auto">
                     <div className="bg-white text-black font-display text-xl p-2 flex justify-between items-center">
                        <span>CONFIG</span>
                        <button onClick={onClose}><Icon name="x" size={20}/></button>
                    </div>
                    <div className="p-4 space-y-6">
                        <div>
                            <div className="text-[10px] font-bold text-nada-accent uppercase mb-2">SIGNAL</div>
                            <div className="flex gap-2">
                                {[{ c: '#ccff00' }, { c: '#06b6d4' }, { c: '#d946ef' }, { c: '#ff5500' }].map(x => (
                                    <button key={x.c} onClick={() => onUpdate({ ...settings, accentColor: x.c })} className={`flex-1 h-8 border border-nada-dim ${settings.accentColor === x.c ? 'ring-1 ring-white' : ''}`} style={{ backgroundColor: x.c }}></button>
                                ))}
                            </div>
                        </div>
                        <div>
                            <div className="text-[10px] font-bold text-nada-accent uppercase mb-2">MODE</div>
                            <div className="flex gap-2">
                                {[{ id: 'light', l: 'JOUR' }, { id: 'dark', l: 'NUIT' }, { id: 'sepia', l: 'TERM' }].map(t => (
                                    <button key={t.id} onClick={() => onUpdate({ ...settings, theme: t.id })} className={`flex-1 py-2 border border-nada-dim text-xs font-bold text-white ${settings.theme === t.id ? 'bg-nada-accent text-black' : ''}`}>{t.l}</button>
                                ))}
                            </div>
                        </div>
                        <div>
                            <div className="text-[10px] font-bold text-nada-accent uppercase mb-2">TYPO</div>
                            <div className="grid grid-cols-2 gap-2">
                                {[{ n: "Syne", l: "Sans" }, { n: "Lora", l: "Serif" }, { n: "Schoolbell", l: "Hand" }].map(f => (
                                    <button key={f.n} onClick={() => onUpdate({ ...settings, fontFamily: f.n })} className={`py-2 border border-nada-dim text-xs text-white ${settings.fontFamily === f.n ? 'border-white' : ''}`} style={{fontFamily: f.n}}>{f.l}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const EpubReader = ({ bookData, bookTitle, onExit }) => {
            const viewerRef = useRef(null);
            const renditionRef = useRef(null);
            const bookRef = useRef(null);
            
            const [isReady, setIsReady] = useState(false);
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('wf_settings');
                return saved ? JSON.parse(saved) : { theme: 'dark', fontSize: 18, fontFamily: "Inter, sans-serif", accentColor: '#ccff00' };
            });
            const [showControls, setShowControls] = useState(true);

            useEffect(() => { document.documentElement.style.setProperty('--accent', settings.accentColor); }, [settings.accentColor]);

            // GLOBAL KEYBOARD LISTENER (Important for navigation)
            useEffect(() => {
                const handleKey = (e) => {
                    if(e.key === "ArrowLeft") renditionRef.current?.prev();
                    if(e.key === "ArrowRight") renditionRef.current?.next();
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            useEffect(() => {
                if (!bookData || typeof window.ePub === 'undefined') return;
                if (viewerRef.current) viewerRef.current.innerHTML = '';
                
                const book = window.ePub(bookData);
                bookRef.current = book;
                const rendition = book.renderTo(viewerRef.current, { width: "100%", height: "100%", flow: "paginated", allowScriptedContent: true });
                renditionRef.current = rendition;

                // Themes
                rendition.themes.register('light', { body: { color: '#000', background: '#fff' } });
                rendition.themes.register('dark', { body: { color: '#ccc', background: '#111' } });
                rendition.themes.register('sepia', { body: { color: settings.accentColor, background: '#000' } }); // Terminal mode
                rendition.themes.select(settings.theme);
                rendition.themes.fontSize(`${settings.fontSize}px`);

                rendition.hooks.content.register((contents) => {
                    const doc = contents.document;
                    // Inject CSS
                    const style = doc.createElement('style');
                    style.innerHTML = `body { padding: 40px !important; font-family: ${settings.fontFamily} !important; } ::selection { background: ${settings.accentColor}; color: black; }`;
                    doc.head.appendChild(style);
                    
                    // SWIPE LOGIC
                    let startX = 0;
                    contents.window.addEventListener('touchstart', (e) => startX = e.changedTouches[0].screenX);
                    contents.window.addEventListener('touchend', (e) => {
                        const diff = startX - e.changedTouches[0].screenX;
                        if(Math.abs(diff) > 50) diff > 0 ? rendition.next() : rendition.prev();
                    });

                    // KEYBOARD IN IFRAME
                    contents.window.addEventListener('keydown', (e) => {
                        if(e.key === "ArrowLeft") rendition.prev();
                        if(e.key === "ArrowRight") rendition.next();
                    });

                    // CLICK TO TOGGLE MENU
                    doc.addEventListener('click', (e) => {
                        if(!e.target.closest('a')) setShowControls(p => !p);
                    });
                });

                rendition.display().then(() => setIsReady(true));
                return () => { if(bookRef.current) bookRef.current.destroy(); };
            }, [bookData, settings.theme, settings.fontSize, settings.fontFamily]); // Re-render on settings change mostly

            return (
                <div className={`h-full w-full relative flex flex-col overflow-hidden ${settings.theme === 'light' ? 'bg-white' : 'bg-black'}`}>
                    <div className={`absolute top-0 left-0 w-full p-4 flex justify-between items-center z-30 transition-transform duration-300 ${showControls ? 'translate-y-0' : '-translate-y-full'}`}>
                        <button onClick={onExit} className="px-3 py-2 bg-black border border-white text-white font-mono text-xs hover:bg-white hover:text-black transition-colors"><Icon name="arrow-left" size={16}/> RETOUR</button>
                        <button onClick={() => setShowControls(true) /* Placeholder for settings modal toggle */} className="p-2 bg-black border border-white text-white"><Icon name="settings" size={16}/></button>
                    </div>

                    <div className="flex-1 flex items-center justify-center p-0 md:p-4 w-full relative z-0 overflow-hidden">
                        <div ref={viewerRef} className="w-full h-full md:w-auto md:h-[90vh] md:aspect-[3/4] shadow-hard border border-nada-border overflow-hidden"></div>
                    </div>

                    {/* Settings Modal would go here using the state showControls + extra state */}
                    {showControls && <ReaderSettings isOpen={true} onClose={() => setShowControls(false)} settings={settings} onUpdate={setSettings} />}
                    
                    {!isReady && <div className="absolute inset-0 z-50 flex items-center justify-center bg-black"><div className="w-16 h-16 border-4 border-nada-dim border-t-nada-accent animate-spin"></div></div>}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('library');
            const [currentBook, setCurrentBook] = useState(null);
            const [bookTitle, setBookTitle] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            const loadBook = async (book) => {
                if(!book.url && !book.data) { alert("ERREUR: DONNÉES MANQUANTES"); return; }
                setIsLoading(true);
                try {
                    let data = book.data;
                    if(!data) { const res = await fetch(book.url); data = await res.arrayBuffer(); }
                    setCurrentBook(data); setBookTitle(book.title); setView('reader');
                } catch(e) { alert("ERREUR CRITIQUE DE CHARGEMENT"); } finally { setIsLoading(false); }
            };

            if (isLoading) return <div className="h-screen w-full flex flex-col items-center justify-center bg-black font-display text-white animate-pulse"><div className="text-4xl text-nada-accent mb-2">CHARGEMENT...</div></div>;
            if (view === 'reader') return <EpubReader bookData={currentBook} bookTitle={bookTitle} onExit={() => setView('library')} />;
            if (view === 'profile') return <UserProfile onBackHome={() => setView('library')} onOpenBook={(bk) => loadBook(bk)} />;
            return <Library onBookSelect={loadBook} onFileUpload={(f) => { const r = new FileReader(); r.onload = (e) => loadBook({data: e.target.result, title: f.name}); r.readAsArrayBuffer(f); }} onAvatarClick={() => setView('profile')} userAvatar={null} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
