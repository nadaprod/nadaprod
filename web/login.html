<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="login.docTitle">NADAPROD — Connexion</title>
<meta name="robots" content="noindex">
<link href="/static/tokens.css" rel="stylesheet">
<link href="/static/tw.css" rel="stylesheet">
<link href="/static/fonts.css" rel="stylesheet">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body class="h-full bg-ink-900 text-ink-100 font-sans antialiased">

<div class="fixed top-0 inset-x-0 h-12 px-3 flex items-center justify-between z-10"><a href="/" class="hover:opacity-80"><img src="/gfx/logo.png" class="h-7" alt="NADAPROD"></a><button type="button" onclick="toggleTheme()" class="btn btn-icon" title="Thème clair / sombre" data-i18n-title="common.theme" aria-label="Thème clair / sombre" data-i18n-aria-label="common.theme">◐</button></div>
<div class="min-h-full flex flex-col items-center justify-center px-6 py-20">

  <form id="loginForm" class="w-full max-w-sm space-y-5">
    <div>
      <h1 class="font-display text-5xl leading-tight" data-i18n="login.title">Connexion</h1>
      <p class="text-sm text-ink-300 mt-3" data-i18n="login.subtitle">Accès sur invitation uniquement.</p>
    </div>
    <div>
      <label for="email" class="label block mb-2" data-i18n="login.email">Email</label>
      <input id="email" type="email" autocomplete="username" required
        class="field w-full h-10 text-sm">
    </div>
    <div>
      <label for="password" class="label block mb-2" data-i18n="login.password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required
        class="field w-full h-10 text-sm">
    </div>
    <p id="error" class="hidden text-xs text-red-400"></p>
    <button id="btnLogin" type="submit"
      class="btn-primary w-full h-11 text-sm" data-i18n="login.submit">
      Se connecter
    </button>
    <p class="text-sm text-ink-300 pt-1" data-i18n="login.noAccount">Pas de compte ? <a href="/waiting-list" class="text-ink-100 underline underline-offset-2 hover:text-acc-fg">Rejoindre la liste d'attente</a></p>
  </form>
</div>

<script>
'use strict';
const form = document.getElementById('loginForm');
const errEl = document.getElementById('error');
const btn = document.getElementById('btnLogin');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = t('login.submitting');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('common.errorCode', { code: res.status }));
    // Redirection interne uniquement (le paramètre next vient de l'URL).
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/sites';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = t('login.submit');
  }
});
</script>
</body>
</html>
