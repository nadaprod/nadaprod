<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="login.docTitle">NADAPROD — Connexion</title>
<meta name="robots" content="noindex">
<link href="/static/tokens.css" rel="stylesheet">
<link href="/static/tw.css" rel="stylesheet">
<link href="/static/fonts.css" rel="stylesheet">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body class="h-full bg-ink-900 text-ink-100 font-sans antialiased">

<div class="fixed top-4 right-4 z-10"><button type="button" onclick="toggleTheme()" class="h-9 w-9 rounded-lg border border-ink-600 hover:bg-ink-800 text-ink-300 hover:text-ink-100 grid place-items-center" title="Thème clair / sombre" data-i18n-title="common.theme" aria-label="Thème clair / sombre" data-i18n-aria-label="common.theme">◐</button></div>
<div class="min-h-full flex flex-col items-center justify-center p-6">
  <a href="/" class="mb-8 hover:opacity-90"><img src="/gfx/logo.png" class="h-12" alt="NADAPROD"></a>

  <form id="loginForm" class="w-full max-w-sm rounded-2xl border border-ink-700 bg-ink-900 p-6 space-y-4">
    <div>
      <h1 class="font-display font-semibold text-lg tracking-tight" data-i18n="login.title">Connexion</h1>
      <p class="text-xs text-ink-400 mt-1" data-i18n="login.subtitle">Accès sur invitation uniquement.</p>
    </div>
    <div>
      <label for="email" class="text-[10px] font-mono uppercase tracking-[0.15em] text-ink-400 block mb-1.5" data-i18n="login.email">Email</label>
      <input id="email" type="email" autocomplete="username" required
        class="w-full h-10 rounded-lg bg-ink-800 border border-ink-600 text-sm px-3 outline-none focus:border-vio-500">
    </div>
    <div>
      <label for="password" class="text-[10px] font-mono uppercase tracking-[0.15em] text-ink-400 block mb-1.5" data-i18n="login.password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required
        class="w-full h-10 rounded-lg bg-ink-800 border border-ink-600 text-sm px-3 outline-none focus:border-vio-500">
    </div>
    <p id="error" class="hidden text-xs text-red-400"></p>
    <button id="btnLogin" type="submit"
      class="w-full h-11 rounded-xl btn-primary text-sm font-semibold disabled:opacity-50" data-i18n="login.submit">
      Se connecter
    </button>
    <p class="text-xs text-ink-400 text-center pt-1" data-i18n="login.noAccount">Pas de compte ? <a href="/waiting-list" class="text-vio-400 hover:underline">Rejoindre la liste d'attente</a></p>
  </form>
</div>

<script>
'use strict';
const form = document.getElementById('loginForm');
const errEl = document.getElementById('error');
const btn = document.getElementById('btnLogin');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = t('login.submitting');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('common.errorCode', { code: res.status }));
    // Redirection interne uniquement (le paramètre next vient de l'URL).
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/sites';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = t('login.submit');
  }
});
</script>
</body>
</html>
